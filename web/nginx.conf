# Runs as the unprivileged `nginx` user: every writable path is under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Document uploads go up to 10 MB each.
  client_max_body_size 12m;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # `add_header` in a location replaces the server's, so each location includes these.
    include /etc/nginx/security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Responses are streamed token by token.
    proxy_buffering off;
    proxy_read_timeout 300s;

    # Docker's DNS, asked again every few seconds: a recreated container gets a new address.
    resolver 127.0.0.11 valid=5s;
    set $gateway http://gateway:8000;
    set $agent http://agent:8001;

    location /api/ {
      proxy_pass $gateway;
    }

    location /v1/ {
      proxy_pass $gateway;
    }

    location /agent-api/ {
      rewrite ^/agent-api/(.*)$ /$1 break;
      proxy_pass $agent;
    }

    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
