# Catalogue of AI tools. The gateway loads it into the inventory on every start, so that
# traffic to these domains is recognised as AI usage. A tool an analyst has rated is never
# overwritten.
#
# IMPORTANT: every status, risk score and risk factor of a real product below is
# ILLUSTRATIVE DEMO DATA. Nobody checked them against any vendor's terms, plans or
# certifications, and they must not be read as statements about a vendor. The inventory
# stores them with `rating_source: seeded` and the UI labels them as illustrative. A company
# replaces them with its own assessment on the Inventory page.
#
# Fields
#   slug, name, description
#   domains       matched against proxy and DNS logs, subdomains included
#   category      tools of one category are offered as alternatives to each other
#   status        approved | tolerated | unapproved | unknown
#   risk_score    1 (low) to 5 (high)
#   risk_factors  trains_on_customer_data, retention_days, data_residency,
#                 enterprise_terms, sso, certifications; leave a factor out when unknown
#   hosted_by_mock_upstream  true for the fictional tools the Chat page can talk to

tools:
  # Fictional tools for the demo. Three are served by mock-upstream; the gateway routes
  # the in-house assistant itself.
  - slug: athena-assist
    name: Approved Tool
    domains: [athena-assist.example]
    category: chat assistant
    status: approved
    risk_score: 1
    risk_factors:
      trains_on_customer_data: false
      retention_days: 0
      data_residency: EU
      enterprise_terms: true
      sso: true
      certifications: [ISO 27001, SOC 2]
    description: Fictional chat assistant the demo company has approved under an enterprise contract.
    hosted_by_mock_upstream: true

  - slug: draftpilot
    name: Tolerated Tool
    domains: [draftpilot.example]
    category: writing assistant
    status: tolerated
