# Default pack: protected terms for the T1 matcher.
#
# Loaded by the gateway at start (gateway/app/protected). Matching ignores case and
# accents and follows Greek inflection and Greeklish spelling, so each term is listed
# once, in its dictionary form. Sources and licences are in SOURCES.md.
#
# Groups:
#   confidentiality-markers  phrases that mark a text as restricted. A hit is flagged for
#                            the policy as CONFIDENTIAL_MARKER and is never masked.
#   given-names-male, given-names-female, surnames
#                            the Greek name gazetteer. A single name is not a finding: it
#                            raises the score of a name the language model found, and a
#                            given name next to a surname is a PERSON.
#
# The pack names no real person: a given name and a surname only ever meet in a prompt.
pack_version: "2026.11.5"
groups:
  - name: confidentiality-markers
    data_type: CONFIDENTIAL_MARKER
    terms:
      - "Confidential"
      - "Strictly confidential"
      - "Highly confidential"
      - "Company confidential"
      - "Private and confidential"
      - "Privileged and confidential"
      - "Proprietary and confidential"
      - "Commercial in confidence"
      - "Internal use only"
      - "For internal use only"
      - "Internal only"
      - "Not for distribution"
      - "Not for circulation"
      - "Do not distribute"
      - "Do not forward"
      - "Do not share externally"
      - "Restricted distribution"
      - "Classified information"
      - "Top secret"
      - "Trade secret"
      - "Attorney-client privileged"
