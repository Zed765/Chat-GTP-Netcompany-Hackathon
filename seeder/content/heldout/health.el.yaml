titles:
  - Ορθοπαιδική γνωμάτευση
  - Ιατρικό πιστοποιητικό εξέτασης εξωτερικών ιατρείων
header: |-
  {clinic}, Ορθοπαιδικό Τμήμα
  Εξεταζόμενο πρόσωπο: {person}
  Ημερομηνία γέννησης: {dob}
  ΑΜΚΑ: {amka}
  Ιατρός: {person2}
  Ημερομηνία εξέτασης: {date}
sections:
  - id: istoriko
    heading: Ιστορικό
    text: >-
      Τραυματισμός του δεξιού γόνατος προ δεκαημέρου κατά τη διάρκεια αγώνα καλαθοσφαίρισης, με
      στροφική κάκωση και άμεσο οίδημα. Αναφέρεται αίσθημα αστάθειας στο βάδισμα και αδυναμία
      πλήρους έκτασης. Δεν προηγήθηκε άλλος τραυματισμός στην ίδια άρθρωση. Δεν λαμβάνεται
      χρόνια φαρμακευτική αγωγή.
  - id: klinika
    heading: Κλινικά ευρήματα
    text: >-
      Μέτρια συλλογή υγρού στην άρθρωση. Ευαισθησία στην ψηλάφηση της έσω αρθρικής σχισμής.
      Δοκιμασία Lachman θετική, με μαλακό τελικό σημείο. Δοκιμασία McMurray επώδυνη στην έσω
      πλευρά. Εύρος κίνησης από δέκα έως ενενήντα μοίρες. Αγγειακός και νευρολογικός έλεγχος
      του σκέλους χωρίς παθολογικά ευρήματα.
  - id: apeikonisi
    heading: Απεικονιστικός έλεγχος
    text: >-
      Οι ακτινογραφίες δεν δείχνουν κάταγμα. Η μαγνητική τομογραφία αναδεικνύει πλήρη ρήξη του
      πρόσθιου χιαστού συνδέσμου και ρήξη του οπίσθιου κέρατος του έσω μηνίσκου. Συνυπάρχει
      οστικό οίδημα στον έξω μηριαίο κόνδυλο. Οι πλάγιοι σύνδεσμοι και ο οπίσθιος χιαστός
      απεικονίζονται ακέραιοι.
  - id: diagnosi
    heading: Διάγνωση
    text: >-
      Ρήξη πρόσθιου χιαστού συνδέσμου δεξιού γόνατος με συνοδό ρήξη έσω μηνίσκου. Πρόκειται για
      αθλητική κάκωση που, με βάση την ηλικία και το επίπεδο δραστηριότητας, αντιμετωπίζεται
      κατά κανόνα χειρουργικά, αφού πρώτα υποχωρήσει το οίδημα και αποκατασταθεί η κινητικότητα
      της άρθρωσης.
  - id: schedio
    heading: Θεραπευτικό σχέδιο
    text: >-
      Προτείνεται αρθροσκοπική συνδεσμοπλαστική με αυτομόσχευμα και συρραφή του μηνίσκου, σε
      τρεις έως τέσσερις εβδομάδες. Μέχρι τότε συνιστώνται λειτουργικός νάρθηκας, βακτηρίες με
      μερική φόρτιση, παγοθεραπεία και ασκήσεις ενδυνάμωσης του τετρακεφάλου υπό την καθοδήγηση
      φυσικοθεραπευτή.
  - id: apokatastasi
    heading: Αποκατάσταση
    text: >-
      Μετά την επέμβαση απαιτείται πρόγραμμα φυσικοθεραπείας διάρκειας έξι μηνών. Η οδήγηση
      επιτρέπεται συνήθως μετά από έξι εβδομάδες. Το τρέξιμο σε ευθεία αρχίζει τον τέταρτο
      μήνα. Η επιστροφή σε αθλήματα με στροφικές κινήσεις δεν συνιστάται πριν από τους εννέα
      μήνες και προϋποθέτει λειτουργικό έλεγχο.
  - id: ergasia
    heading: Ικανότητα για εργασία
    text: >-
      Για εργασία γραφείου η αποχή εκτιμάται σε δύο εβδομάδες μετά την επέμβαση, με δυνατότητα
      τηλεργασίας από την πρώτη εβδομάδα. Για εργασία με ορθοστασία ή χειρωνακτικά καθήκοντα
      η αποχή φτάνει τους τρεις μήνες. Χορηγείται βεβαίωση για τον εργοδότη χωρίς αναγραφή της
      διάγνωσης.
  - id: enimerosi
    heading: Ενημέρωση και συναίνεση
    text: >-
      Εξηγήθηκαν η φύση της επέμβασης, οι εναλλακτικές επιλογές και οι πιθανές επιπλοκές, όπως
      η λοίμωξη, η θρόμβωση και η δυσκαμψία. Δόθηκε έντυπο ενημέρωσης και χρόνος για
      ερωτήσεις. Η απόφαση για την επέμβαση θα ληφθεί στην επόμενη επίσκεψη, σε δέκα ημέρες,
      μαζί με τον προεγχειρητικό έλεγχο.
footer: |-
  Υπογραφή και σφραγίδα ιατρού: {person2}
  Το έγγραφο περιέχει δεδομένα υγείας και προορίζεται μόνο για το εξεταζόμενο πρόσωπο.
