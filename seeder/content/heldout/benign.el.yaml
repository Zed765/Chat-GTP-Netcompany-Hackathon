language: el
intros:
  - "Καλημέρα! Έχω μερικές διαφορετικές ερωτήσεις σήμερα."
  - "Θα εκτιμούσα τη βοήθειά σου σε κάποια καθημερινά ζητήματα."
  - "Γεια σου. Μάζεψα μερικά πράγματα που ήθελα να ρωτήσω."
bridges:
  - "Στη συνέχεια, κάτι άσχετο."
  - "Αλλάζω θέμα."
  - "Ορίστε και ένα ακόμη."
closers:
  - "Και μια γρήγορη τελευταία ερώτηση."
  - "Ένα ακόμη, σύντομα."
  - "Τέλος."
topics:
  - id: parti
    paragraphs:
      - >-
        Η κόρη μου κλείνει τα οκτώ τον άλλο μήνα και θα καλέσουμε δέκα παιδιά στο σπίτι για το
        απόγευμα. Χρειάζομαι ένα πρόγραμμα δύο ωρών που θα τα κρατήσει απασχολημένα χωρίς
        επαγγελματία ψυχαγωγό. Η αυλή είναι μικρή και μπορεί να βρέξει, άρα θέλω και λύσεις για
        μέσα.
      - >-
        Πρότεινέ μου πέντε παιχνίδια κατάλληλα για την ηλικία, με τα υλικά που χρειάζεται το
        καθένα, και μια σειρά που εναλλάσσει τα ζωηρά με τα ήσυχα. Ένα κυνήγι θησαυρού θα
        άρεσε πολύ· γράψε έξι γρίφους με ομοιοκαταληξία που οδηγούν από δωμάτιο σε δωμάτιο και
        καταλήγουν στην τούρτα.
      - >-
        Θα ήθελα επίσης ιδέες για απλό φαγητό που τρώνε τα περισσότερα παιδιά, ένα οικονομικό
        αναμνηστικό δωράκι και ένα κείμενο για την πρόσκληση, με μια φράση που ζητά από τους
        γονείς να με ενημερώσουν για αλλεργίες. Μια λίστα ελέγχου για την τελευταία εβδομάδα θα
        με έσωζε.
  - id: anakyklosi
    paragraphs:
      - >-
        Ετοιμάζω μια σύντομη ομιλία για τον σύλλογο γονέων με θέμα την ανακύκλωση και θέλω να
        την εξηγήσω σωστά αλλά χωρίς δύσκολους όρους. Μπορείς να περιγράψεις τι γίνεται με ένα
        πλαστικό μπουκάλι από τη στιγμή που μπαίνει στον κάδο μέχρι να γίνει νέο προϊόν;
      - >-
        Θα βοηθούσε να ξέρω ποια υλικά ανακυκλώνονται εύκολα και ποια όχι, γιατί πρέπει να
        ξεπλένουμε τις συσκευασίες και τι σημαίνουν τα σύμβολα με τα βέλη. Πες μου και ποια
        είναι τα συνηθέστερα λάθη που κάνουμε στο σπίτι όταν ξεχωρίζουμε τα απορρίμματα.
      - >-
        Οι γονείς μάλλον θα ρωτήσουν για την κομποστοποίηση και για το αν αξίζει πραγματικά ο
        κόπος. Γράψε δύο τρεις καθαρές προτάσεις για το καθένα και πρότεινε μια απλή
        δραστηριότητα που μπορούν να κάνουν τα παιδιά στο σχολείο για να μάθουν να ξεχωρίζουν
        τα υλικά.
  - id: sql
    paragraphs:
      - >-
        Μαθαίνω SQL και μπερδεύομαι με τις συνενώσεις πινάκων. Έχω έναν πίνακα με μαθητές και
        έναν με βαθμούς, και θέλω μια λίστα με όλους τους μαθητές και τον μέσο όρο τους, ακόμη
        και για όσους δεν έχουν κανέναν βαθμό. Με το απλό JOIN οι μαθητές χωρίς βαθμούς
        χάνονται.
      - >-
        Διάβασα ότι χρειάζομαι LEFT JOIN, αλλά δεν καταλαβαίνω πού μπαίνει η συνθήκη και τι
        ρόλο παίζει το GROUP BY. Μπορείς να γράψεις το ερώτημα βήμα βήμα και να εξηγήσεις τι
        επιστρέφει κάθε γραμμή; Θα ήθελα οι μαθητές χωρίς βαθμούς να εμφανίζονται με μηδέν και
        όχι με κενό.
      - >-
        Εξήγησέ μου επίσης τη διαφορά ανάμεσα στο WHERE και στο HAVING, και πώς θα έδειχνα μόνο
        όσους έχουν μέσο όρο πάνω από δεκαπέντε. Ένα μικρό παράδειγμα με πέντε έξι γραμμές
        δεδομένων, που να μπορώ να το τρέξω μόνη μου, θα με βοηθούσε να το εμπεδώσω.
  - id: marathonios
    paragraphs:
      - >-
        Γράφω ένα κείμενο για το περιοδικό του σχολείου με θέμα την ιστορία του μαραθωνίου
        δρόμου. Θέλω να ξεκινήσω από τον θρύλο του αγγελιοφόρου που έτρεξε από τον Μαραθώνα
        στην Αθήνα και να εξηγήσω τι από αυτά θεωρείται ιστορικά βέβαιο και τι παράδοση.
      - >-
        Στη συνέχεια χρειάζομαι μία παράγραφο για το πώς ο αγώνας μπήκε στο πρόγραμμα των
        πρώτων σύγχρονων Ολυμπιακών Αγώνων το 1896 και για το πώς καθιερώθηκε η απόσταση των
        σαράντα δύο χιλιομέτρων και εκατόν ενενήντα πέντε μέτρων λίγα χρόνια αργότερα.
      - >-
        Για το κλείσιμο θα ήθελα λίγα λόγια για τη σημερινή αυθεντική διαδρομή και για το τι
        χρειάζεται να προσέξει κάποιος που θέλει να τρέξει για πρώτη φορά έναν αγώνα δέκα
        χιλιομέτρων. Το ύφος να είναι ζωντανό, για μαθητές γυμνασίου, και το κείμενο γύρω στις
        τριακόσιες πενήντα λέξεις.
  - id: podilato
    paragraphs:
      - >-
        Άρχισα να πηγαίνω στη δουλειά με ποδήλατο, περίπου έξι χιλιόμετρα η διαδρομή, και θα
        ήθελα να το συντηρώ μόνος μου. Τι πρέπει να ελέγχω κάθε εβδομάδα, κάθε μήνα και μία
        φορά τον χρόνο; Έχω μια βασική σειρά εργαλείων, τρόμπα με μανόμετρο και λάδι αλυσίδας.
      - >-
        Εξήγησέ μου πώς καταλαβαίνω ότι η αλυσίδα θέλει καθάρισμα ή αλλαγή, ποια πίεση
        ταιριάζει στα λάστιχα για δρόμους πόλης και πώς ρυθμίζονται τα φρένα όταν αρχίζουν να
        σφυρίζουν. Οδηγίες βήμα βήμα για το μπάλωμα σαμπρέλας στον δρόμο θα ήταν πολύ χρήσιμες.
      - >-
        Τέλος, τι αξίζει να έχω πάντα μαζί μου, και τι ρούχα και φώτα προτείνεις για τα
        σκοτεινά πρωινά του χειμώνα; Μια σύντομη λίστα με τα σημάδια που δείχνουν ότι
        χρειάζεται επίσκεψη σε τεχνίτη θα με βοηθούσε να ξέρω τα όριά μου.
