kind: financial
category: FINANCIAL
language: el
numbered: false
titles:
  - "Εισήγηση προϋπολογισμού έτους {year}"
  - "Σχέδιο ετήσιου προϋπολογισμού {year}"
header: |-
  Προς: την Εκτελεστική Επιτροπή της {org_legal}
  Από: {lead}, Οικονομικές Υπηρεσίες
  Ημερομηνία: {date}
  Περιορισμένη διανομή. Προσχέδιο, δεν έχει εγκριθεί.
sections:
  - id: eisagogi
    heading: Γενική εικόνα
    text: >-
      Με το παρόν υποβάλλεται το σχέδιο προϋπολογισμού της επόμενης χρονιάς. Προβλέπονται
      συνολικά έσοδα {amount3} και πλεόνασμα {amount}, δηλαδή {percent}% επί των εσόδων. Το
      σχέδιο είναι συντηρητικό: δεν περιλαμβάνει νέα προϊόντα και λαμβάνει υπόψη μόνο τις
      ανατιμήσεις που έχουν ήδη ανακοινωθεί στους πελάτες.
  - id: esoda
    heading: Παραδοχές για τα έσοδα
    text: >-
      Τα έσοδα από συνδρομές εκτιμάται ότι θα αυξηθούν κατά {percent}%, χάρη στις ανανεώσεις με
      τον νέο τιμοκατάλογο. Τα έσοδα από συμβουλευτικές υπηρεσίες παραμένουν σταθερά. Έχουμε
      υποθέσει ότι το ποσοστό αποχώρησης πελατών δεν θα μεταβληθεί· κάθε επιπλέον ποσοστιαία
      μονάδα αποχώρησης μειώνει τα έσοδα κατά {rate2} περίπου.
  - id: misthodosia
    heading: Μισθοδοσία
    text: >-
      Η μισθοδοσία αποτελεί το μεγαλύτερο κονδύλι, με {amount2}. Καλύπτει γενική αύξηση τρία
      τοις εκατό από τον Απρίλιο, εννέα νέες θέσεις που θα καλυφθούν σταδιακά και τις
      εργοδοτικές εισφορές με τους ισχύοντες συντελεστές. Το κονδύλι για πριμ ορίζεται σε
      {amount5} και καταβάλλεται μόνο αν επιτευχθεί ο στόχος του πλεονάσματος.
  - id: leitourgika
    heading: Λοιπά λειτουργικά έξοδα
    text: >-
      Το κόστος φιλοξενίας στο υπολογιστικό νέφος αυξάνεται ανάλογα με τη χρήση, στα {amount4}.
      Τα ενοίκια είναι σταθερά βάσει του μισθωτηρίου. Τα έξοδα ταξιδιών περικόπτονται κατά το
      ένα πέμπτο. Διατηρείται κεντρικό αποθεματικό {rate}, που αποδεσμεύεται μόνο με απόφαση
      του οικονομικού διευθυντή.
  - id: ependyseis
    heading: Επενδύσεις
    text: >-
      Προτείνονται επενδυτικές δαπάνες {amount5}: αντικατάσταση φορητών υπολογιστών στον
      τετραετή κύκλο, ανακαίνιση των αιθουσών συσκέψεων του δεύτερου ορόφου και πρώτη φάση του
      νέου συστήματος τιμολόγησης. Η απόσβεση του συστήματος αναμένεται σε τρία έτη, από τη
      μείωση των διαγραφών απαιτήσεων και το ταχύτερο κλείσιμο του μήνα.
  - id: tameio
    heading: Ταμείο και χρηματοδότηση
    text: >-
      Με βάση τα μεγέθη αυτά, τα ταμειακά διαθέσιμα δεν πέφτουν κάτω από {amount} σε κανένα
      σημείο του έτους· το χαμηλότερο σημείο είναι ο Αύγουστος, όταν πληρώνονται οι ετήσιες
      άδειες λογισμικού. Δεν απαιτείται νέος δανεισμός. Η υφιστάμενη πιστωτική γραμμή
      διατηρείται προληπτικά.
  - id: senaria
    heading: Σενάρια ευαισθησίας
    text: >-
      Εξετάστηκαν τρία δυσμενή σενάρια: καθυστέρηση των προσλήψεων κατά ένα τρίμηνο, απώλεια
      του μεγαλύτερου πελάτη και αύξηση των τιμών φιλοξενίας κατά δέκα τοις εκατό. Μόνο η
      απώλεια του μεγαλύτερου πελάτη μετατρέπει το πλεόνασμα σε έλλειμμα, και τότε θα
      ανακληθούν το κονδύλι για πριμ και η ανακαίνιση.
  - id: apofaseis
    heading: Ζητούμενες αποφάσεις
    text: >-
      Η Επιτροπή καλείται να εγκρίνει τον προϋπολογισμό εσόδων και εξόδων, να εγκρίνει τις
      επενδύσεις με την επιφύλαξη χωριστής μελέτης σκοπιμότητας για το σύστημα τιμολόγησης και
      να επικυρώσει τον στόχο του πλεονάσματος. Οι διευθύνσεις θα ενημερωθούν για τα κονδύλιά
      τους μέσα σε μία εβδομάδα από την έγκριση.
footer: |-
  {lead}
  Οικονομικές Υπηρεσίες
