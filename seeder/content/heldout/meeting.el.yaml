kind: meeting
category: CLIENT_CONFIDENTIAL
language: el
numbered: true
titles:
  - "Πρακτικά συντονιστικής επιτροπής: μεταφορά γραφείων"
  - "Πρακτικά συνάντησης ομάδας έργου μετεγκατάστασης"
header: |-
  Ημερομηνία: {date}
  Παρόντες: {lead}, {lead2}, {contact}
  Θέμα: μεταφορά των γραφείων της εταιρείας {org} στο νέο κτίριο
  Τα πρακτικά τηρούνται για εσωτερική ενημέρωση και δεν δημοσιοποιούνται.
sections:
  - id: chronodiagramma
    heading: Χρονοδιάγραμμα
    text: >-
      Η μεταφορά παραμένει προγραμματισμένη για το τελευταίο Σαββατοκύριακο του μήνα. Ο
      ιδιοκτήτης του νέου κτιρίου επιβεβαίωσε ότι οι εργασίες στον τρίτο όροφο τελειώνουν μία
      εβδομάδα νωρίτερα. Αν υπάρξει καθυστέρηση στην παράδοση των κλειδιών, η μεταφορά
      μετατίθεται κατά δεκαπέντε ημέρες και όχι λιγότερο, λόγω της διαθεσιμότητας του
      συνεργείου.
  - id: proypologismos
    heading: Προϋπολογισμός
    text: >-
      Έχουν δαπανηθεί μέχρι σήμερα {amount} από τα {amount2} που έχουν εγκριθεί. Η προσφορά της
      μεταφορικής εταιρείας ήταν χαμηλότερη από την εκτίμηση, ενώ η καλωδίωση του δικτύου
      κόστισε περισσότερο. Συνολικά το έργο κινείται εντός ορίων, με περιθώριο {rate2} για
      απρόβλεπτα.
  - id: diarrythmisi
    heading: Διαρρύθμιση χώρων
    text: >-
      Εγκρίθηκε το τελικό σχέδιο με ανοιχτό χώρο εργασίας, έξι αίθουσες συσκέψεων και δύο
      μικρά δωμάτια για τηλεφωνήματα. Οι ομάδες που χειρίζονται εμπιστευτικά έγγραφα θα
      στεγαστούν σε χώρο με ελεγχόμενη πρόσβαση. Τα γραφεία μοιράζονται ανά ομάδα και όχι ανά
      άτομο, με ντουλάπια που κλειδώνουν.
  - id: pliroforiki
    heading: Πληροφορική και τηλεφωνία
    text: >-
      Η νέα γραμμή οπτικής ίνας έχει ενεργοποιηθεί και δοκιμαστεί. Οι διακομιστές δεν
      μεταφέρονται, αφού οι υπηρεσίες έχουν ήδη περάσει στο υπολογιστικό νέφος. Το τηλεφωνικό
      κέντρο αντικαθίσταται από εφαρμογή στους υπολογιστές. Την Παρασκευή πριν από τη μεταφορά
      όλοι αποσυνδέουν και σημαίνουν τον εξοπλισμό τους μέχρι τις τέσσερις.
  - id: prosopiko
    heading: Ενημέρωση προσωπικού
    text: >-
      Θα σταλεί αναλυτικό μήνυμα σε όλους δέκα ημέρες πριν, με οδηγίες συσκευασίας, χάρτη
      πρόσβασης και πληροφορίες για τη στάθμευση. Όσοι επιθυμούν μπορούν να εργαστούν από το
      σπίτι τη Δευτέρα μετά τη μεταφορά. Προγραμματίζεται ξενάγηση στον νέο χώρο ανά ομάδα την
      προηγούμενη εβδομάδα.
  - id: asfaleia
    heading: Ασφάλεια και αρχείο
    text: >-
      Το φυσικό αρχείο θα καταγραφεί και θα σφραγιστεί σε αριθμημένα κιβώτια πριν από τη
      μεταφορά. Έγγραφα που έχουν ξεπεράσει τον χρόνο τήρησης καταστρέφονται από
      πιστοποιημένη εταιρεία και όχι από το συνεργείο. Οι κάρτες εισόδου του νέου κτιρίου θα
      παραδοθούν ενυπόγραφα την ημέρα της ξενάγησης.
  - id: palio_ktirio
    heading: Παράδοση παλαιού μισθίου
    text: >-
      Το παλαιό μίσθιο πρέπει να αποδοθεί κενό και βαμμένο έως το τέλος του επόμενου μήνα. Ο
      εκμισθωτής θα επιθεωρήσει τον χώρο πριν επιστρέψει την εγγύηση. Έπιπλα που δεν θα
      μεταφερθούν προσφέρονται πρώτα στο προσωπικό και τα υπόλοιπα δωρίζονται σε σχολείο της
      περιοχής.
  - id: energeies
    heading: Ενέργειες
    text: >-
      {lead}: τελική επιβεβαίωση ημερομηνίας με τη μεταφορική εταιρεία και τον ιδιοκτήτη.
      {lead2}: μήνυμα προς το προσωπικό και πρόγραμμα ξεναγήσεων. {contact}: καταγραφή του
      αρχείου και παραγγελία καρτών εισόδου. Η επιτροπή συνεδριάζει ξανά σε μία εβδομάδα, την
      ίδια ώρα.
footer: |-
  Τα πρακτικά συνέταξε: {lead2}
