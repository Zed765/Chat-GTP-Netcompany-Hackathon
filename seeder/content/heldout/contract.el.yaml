kind: contract
category: CONTRACT
language: el
numbered: true
titles:
  - Ιδιωτικό Συμφωνητικό Μίσθωσης Επαγγελματικής Στέγης
  - Μισθωτήριο Γραφείου
header: |-
  Στη Θεσσαλονίκη, σήμερα {date}, μεταξύ της εταιρείας {client:legal}, με έδρα {client_address} και ΑΦΜ {client_afm}, η οποία στο εξής θα αποκαλείται «Εκμισθωτής», και της εταιρείας {org_legal}, με έδρα {org_address} και ΑΦΜ {org_afm}, η οποία στο εξής θα αποκαλείται «Μισθωτής», συνάπτεται η παρούσα μίσθωση με τους ακόλουθους όρους.
sections:
  - id: misthio
    heading: Μίσθιο
    text: >-
      Ο Εκμισθωτής εκμισθώνει στον Μισθωτή έναν όροφο γραφείων επιφάνειας τριακοσίων είκοσι
      τετραγωνικών μέτρων, με δύο θέσεις στάθμευσης στο υπόγειο του κτιρίου. Ο Μισθωτής
      επισκέφθηκε το μίσθιο, το βρήκε της απολύτου αρεσκείας του και κατάλληλο για τη χρήση που
      το προορίζει, και το παραλαμβάνει στην κατάσταση που βρίσκεται.
  - id: diarkeia
    heading: Χρόνος μίσθωσης
    text: >-
      Η διάρκεια της μίσθωσης ορίζεται σε {years} έτη και αρχίζει στις {start_date}. Μετά την
      πάροδο του πρώτου έτους ο Μισθωτής δικαιούται να καταγγείλει τη μίσθωση εγγράφως, και τα
      αποτελέσματα της καταγγελίας επέρχονται τρεις μήνες μετά την κοινοποίησή της. Σιωπηρή
      αναμίσθωση ή παράταση αποκλείεται ρητά.
  - id: misthoma
    heading: Μίσθωμα
    text: >-
      Το μηνιαίο μίσθωμα ορίζεται σε {rate2} και προκαταβάλλεται το πρώτο πενθήμερο κάθε μήνα
      με κατάθεση στον τραπεζικό λογαριασμό του Εκμισθωτή {client_iban}. Το μίσθωμα
      αναπροσαρμόζεται κάθε έτος κατά το ποσοστό μεταβολής του δείκτη τιμών καταναλωτή. Το τέλος
      χαρτοσήμου, όπου οφείλεται, βαρύνει τον Μισθωτή.
  - id: eggyisi
    heading: Εγγυοδοσία
    text: >-
      Ο Μισθωτής κατέβαλε σήμερα στον Εκμισθωτή ποσό ίσο με δύο μηνιαία μισθώματα ως εγγύηση
      για την καλή τήρηση των όρων της μίσθωσης. Η εγγύηση επιστρέφεται άτοκα μετά τη λήξη της
      μίσθωσης και την παράδοση των κλειδιών, εφόσον δεν οφείλονται μισθώματα, λογαριασμοί ή
      αποζημίωση για φθορές. Δεν συμψηφίζεται με μισθώματα.
  - id: chrisi
    heading: Χρήση του μισθίου
    text: >-
      Το μίσθιο θα χρησιμοποιηθεί αποκλειστικά ως γραφείο. Απαγορεύεται κάθε μεταβολή της
      χρήσης, καθώς και η ολική ή μερική υπομίσθωση ή παραχώρηση σε τρίτο, χωρίς την έγγραφη
      συναίνεση του Εκμισθωτή. Ο Μισθωτής οφείλει να τηρεί τον κανονισμό του κτιρίου και να μην
      ενοχλεί τους λοιπούς ενοίκους.
  - id: dapanes
    heading: Δαπάνες και επισκευές
    text: >-
      Τον Μισθωτή βαρύνουν οι λογαριασμοί ηλεκτρικού ρεύματος, ύδρευσης και τηλεπικοινωνιών, τα
      κοινόχρηστα και τα δημοτικά τέλη. Οι επισκευές που οφείλονται στη συνήθη χρήση γίνονται
      με δαπάνη του Μισθωτή. Προσθήκες ή διαρρυθμίσεις επιτρέπονται μόνο με έγγραφη άδεια και
      παραμένουν προς όφελος του μισθίου χωρίς αποζημίωση.
  - id: lixi
    heading: Λήξη και απόδοση του μισθίου
    text: >-
      Κατά τη λήξη ή τη λύση της μίσθωσης ο Μισθωτής οφείλει να αποδώσει το μίσθιο ελεύθερο και
      στην κατάσταση που το παρέλαβε. Για κάθε ημέρα καθυστέρησης οφείλει, ως ποινική ρήτρα,
      ποσό ίσο με το διπλάσιο του ημερήσιου μισθώματος. Τους τελευταίους τρεις μήνες ο
      Εκμισθωτής μπορεί να δείχνει το μίσθιο σε υποψήφιους μισθωτές.
  - id: paravasi
    heading: Παράβαση όρων
    text: >-
      Η καθυστέρηση καταβολής του μισθώματος ή των κοινοχρήστων πέραν των δέκα ημερών, καθώς
      και η παράβαση οποιουδήποτε όρου της παρούσας, που όλοι θεωρούνται ουσιώδεις, παρέχει
      στον Εκμισθωτή το δικαίωμα να καταγγείλει τη μίσθωση και να ζητήσει την έξωση του
      Μισθωτή κατά τη νόμιμη διαδικασία.
  - id: telika
    heading: Λοιποί όροι
    text: >-
      Κάθε τροποποίηση του παρόντος αποδεικνύεται μόνο με έγγραφο. Η μη άσκηση δικαιώματος από
      τον Εκμισθωτή δεν σημαίνει παραίτηση από αυτό. Η μίσθωση θα δηλωθεί ηλεκτρονικά στη
      φορολογική διοίκηση εντός της νόμιμης προθεσμίας. Αρμόδια για κάθε διαφορά ορίζονται τα
      δικαστήρια της Θεσσαλονίκης.
footer: |-
  Για τον Εκμισθωτή: {contact}
  Για τον Μισθωτή: {lead}
