kind: hr
category: HR
language: el
numbered: false
titles:
  - Πρόταση πρόσληψης και όροι απασχόλησης
  - Επιστολή προσφοράς θέσης εργασίας
header: |-
  Προσωπικό και εμπιστευτικό.
  Προς: {person:acc}
  Από: {person2:acc}, Διεύθυνση Ανθρώπινου Δυναμικού
  Ημερομηνία: {date}
  Αριθμός αναφοράς: {reference}
sections:
  - id: prosfora
    heading: Προσφορά θέσης
    text: >-
      Μετά την ολοκλήρωση των συνεντεύξεων, με χαρά σάς προσφέρουμε τη θέση του αναλυτή
      δεδομένων στη Διεύθυνση Πληροφορικής της εταιρείας μας. Η προσφορά ισχύει για δέκα
      ημέρες από την ημερομηνία της επιστολής και τελεί υπό την προϋπόθεση του επιτυχούς
      ελέγχου των δικαιολογητικών που αναφέρονται παρακάτω.
  - id: symvasi
    heading: Είδος και διάρκεια σύμβασης
    text: >-
      Η σύμβαση εργασίας είναι αορίστου χρόνου, πλήρους απασχόλησης, με έναρξη στις
      {start_date}. Οι πρώτοι έξι μήνες αποτελούν δοκιμαστική περίοδο, κατά την οποία κάθε
      πλευρά μπορεί να λύσει τη σύμβαση χωρίς προειδοποίηση. Τόπος εργασίας είναι τα κεντρικά
      γραφεία, με δυνατότητα τηλεργασίας έως δύο ημέρες την εβδομάδα.
  - id: apodoches
    heading: Αποδοχές
    text: >-
      Οι μικτές μηνιαίες αποδοχές ορίζονται σε {salary} και καταβάλλονται την τελευταία
      εργάσιμη ημέρα κάθε μήνα, μαζί με τα επιδόματα εορτών και αδείας που προβλέπει ο νόμος.
      Μετά τη δοκιμαστική περίοδο οι αποδοχές αναπροσαρμόζονται σε {salary2}. Προβλέπεται
      ετήσιο πριμ απόδοσης έως έναν μηνιαίο μισθό.
  - id: paroches
    heading: Πρόσθετες παροχές
    text: >-
      Παρέχονται ιδιωτική ασφάλιση υγείας για εσάς και τα προστατευόμενα μέλη της οικογένειάς
      σας, κάρτα σίτισης αξίας εκατόν είκοσι ευρώ τον μήνα, φορητός υπολογιστής και κινητό
      τηλέφωνο. Το ετήσιο ποσό για επαγγελματική εκπαίδευση ανέρχεται σε {rate}, και οι
      πιστοποιήσεις που συνδέονται με τη θέση καλύπτονται πλήρως.
  - id: orario
    heading: Ωράριο και άδειες
    text: >-
      Το ωράριο είναι σαράντα ώρες την εβδομάδα, από Δευτέρα έως Παρασκευή, με ευέλικτη ώρα
      προσέλευσης μεταξύ οκτώ και δέκα το πρωί. Η ετήσια κανονική άδεια είναι είκοσι τρεις
      εργάσιμες ημέρες από το πρώτο έτος. Η υπερωριακή απασχόληση απαιτεί προηγούμενη έγκριση
      και αμείβεται σύμφωνα με τη νομοθεσία.
  - id: dikaiologitika
    heading: Δικαιολογητικά πρόσληψης
    text: >-
      Πριν από την έναρξη θα χρειαστούμε αντίγραφο του δελτίου ταυτότητας, τον ΑΜΚΑ και τον ΑΦΜ
      σας, αντίγραφα των τίτλων σπουδών, τον αριθμό τραπεζικού λογαριασμού για τη μισθοδοσία και
      βεβαίωση προϋπηρεσίας από τον τελευταίο εργοδότη. Τα στοιχεία τηρούνται στον ατομικό σας
      φάκελο και χρησιμοποιούνται μόνο για τους σκοπούς της απασχόλησης.
  - id: echemytheia
    heading: Εχεμύθεια και πνευματική ιδιοκτησία
    text: >-
      Με την υπογραφή της σύμβασης αναλαμβάνετε υποχρέωση εχεμύθειας για κάθε πληροφορία της
      εταιρείας και των πελατών της, η οποία συνεχίζει να ισχύει και μετά την αποχώρησή σας.
      Ό,τι δημιουργείτε στο πλαίσιο των καθηκόντων σας ανήκει στην εταιρεία. Δεν προβλέπεται
      ρήτρα μη ανταγωνισμού.
  - id: apodochi
    heading: Αποδοχή της προσφοράς
    text: >-
      Αν συμφωνείτε, παρακαλούμε να επιστρέψετε υπογεγραμμένο αντίγραφο της επιστολής μέσα στην
      προθεσμία που αναφέρεται παραπάνω. Στη συνέχεια θα λάβετε τη σύμβαση εργασίας και το
      πρόγραμμα της πρώτης εβδομάδας. Για κάθε απορία μπορείτε να επικοινωνήσετε απευθείας με
      τη Διεύθυνση Ανθρώπινου Δυναμικού.
footer: |-
  Με εκτίμηση,
  {person2}
  Διεύθυνση Ανθρώπινου Δυναμικού
