kind: financial
category: FINANCIAL
language: el
numbered: false
titles:
  - "Οικονομικά αποτελέσματα: {quarter} {year}"
  - "Τριμηνιαία οικονομική έκθεση προς το Διοικητικό Συμβούλιο, {quarter} {year}"
  - "Απολογισμός οικονομικής διαχείρισης, {quarter} {year}"
header: |-
  {org_legal}
  Σύνταξη: Οικονομική Διεύθυνση, {date}. Αποκλειστικά για τα μέλη του Διοικητικού Συμβουλίου και τη διοίκηση.
sections:
  - id: synopsi
    heading: Σύνοψη
    text: >-
      Ο κύκλος εργασιών του τριμήνου ανήλθε σε {amount3}, αυξημένος κατά {percent}% σε σχέση με
      το αντίστοιχο περσινό τρίμηνο. Τα κέρδη προ φόρων, τόκων και αποσβέσεων διαμορφώθηκαν σε
      {amount2} και τα καθαρά κέρδη μετά από φόρους σε {amount}. Η βελτίωση οφείλεται κυρίως
      στην αύξηση των πωλήσεων στην εγχώρια αγορά.
  - id: poliseis
    heading: Πωλήσεις
    text: >-
      Οι πωλήσεις εμπορευμάτων αντιστοιχούν στα δύο τρίτα περίπου του κύκλου εργασιών και οι
      υπηρεσίες στο υπόλοιπο. Οι δέκα μεγαλύτεροι πελάτες συγκεντρώνουν το {percent2}% των
      εσόδων. Οι εξαγωγές παρέμειναν στα ίδια επίπεδα, ενώ οι τιμές πώλησης δεν μεταβλήθηκαν
      ουσιωδώς μέσα στο τρίμηνο.
  - id: kostos
    heading: Κόστος πωληθέντων και μικτό κέρδος
    text: >-
      Το κόστος πωληθέντων αυξήθηκε με βραδύτερο ρυθμό από τις πωλήσεις, με αποτέλεσμα το μικτό
      περιθώριο κέρδους να ανέλθει στο {percent2}%. Οι τιμές των πρώτων υλών ήταν χαμηλότερες
      από τον προϋπολογισμό, ενώ τα μεταφορικά υψηλότερα. Διενεργήθηκε απομείωση αποθεμάτων
      ύψους {rate2}.
  - id: dapanes
    heading: Λειτουργικές δαπάνες
    text: >-
      Τα έξοδα διοίκησης και διάθεσης ανήλθαν σε {amount4}. Οι αμοιβές προσωπικού αυξήθηκαν λόγω
      των ετήσιων μισθολογικών αναπροσαρμογών και τεσσάρων νέων προσλήψεων. Οι δαπάνες
      προβολής μεταφέρθηκαν στο επόμενο τρίμηνο. Οι αποσβέσεις παρέμειναν αμετάβλητες και τα
      χρηματοοικονομικά έξοδα μειώθηκαν.
  - id: tameiakes_roes
    heading: Ταμειακές ροές
    text: >-
      Οι ταμειακές ροές από λειτουργικές δραστηριότητες ήταν θετικές κατά {amount2}. Για
      επενδύσεις σε πάγια διατέθηκαν {amount5}. Αποπληρώθηκαν τραπεζικά δάνεια ύψους {amount}.
      Τα ταμειακά διαθέσιμα στο τέλος του τριμήνου ανέρχονταν σε {amount3} και το όριο
      υπερανάληψης δεν χρησιμοποιήθηκε.
  - id: kefalaio_kinisis
    heading: Κεφάλαιο κίνησης
    text: >-
      Οι εμπορικές απαιτήσεις ανήλθαν σε {amount4}, που αντιστοιχούν σε {days2} ημέρες πωλήσεων.
      Για επισφαλείς απαιτήσεις έχει σχηματιστεί πρόβλεψη {rate2}. Οι υποχρεώσεις προς
      προμηθευτές εξοφλούνται κατά μέσο όρο σε {days} ημέρες. Η κυκλοφοριακή ταχύτητα των
      αποθεμάτων βελτιώθηκε ελαφρά.
  - id: isologismos
    heading: Ισολογισμός και δανεισμός
    text: >-
      Το σύνολο του ενεργητικού παρέμεινε ουσιαστικά αμετάβλητο. Ο καθαρός δανεισμός μειώθηκε σε
      {amount5}. Τα ίδια κεφάλαια αυξήθηκαν κατά τα κέρδη της περιόδου. Η εταιρεία τηρεί όλους
      τους χρηματοοικονομικούς δείκτες που προβλέπουν οι δανειακές της συμβάσεις, με επαρκές
      περιθώριο ασφαλείας.
  - id: apokliseis
    heading: Αποκλίσεις από τον προϋπολογισμό
    text: >-
      Ο κύκλος εργασιών υπερέβη τον προϋπολογισμό κατά {percent}% και το λειτουργικό αποτέλεσμα
      λίγο περισσότερο. Θετικά επέδρασαν ο όγκος των πωλήσεων και το κόστος ενέργειας. Αρνητικά
      επέδρασαν τα μεταφορικά, οι υπερωρίες της αποθήκης και η καθυστέρηση στη λειτουργία της
      νέας γραμμής παραγωγής.
  - id: provlepseis
    heading: Προοπτικές
    text: >-
      Το ανεκτέλεστο υπόλοιπο παραγγελιών στηρίζει τον ετήσιο στόχο, τον οποίο η διοίκηση
      αναθεώρησε ελαφρώς προς τα πάνω. Οι κυριότερες αβεβαιότητες αφορούν τις τιμές των πρώτων
      υλών και την έκβαση δύο μεγάλων διαγωνισμών. Από το επόμενο τρίμηνο εφαρμόζεται αύξηση
      τιμών {percent}% στις νέες παραγγελίες.
  - id: forologika
    heading: Φορολογικά και λοιπά θέματα
    text: >-
      Ο φόρος εισοδήματος της περιόδου υπολογίστηκε με συντελεστή είκοσι δύο τοις εκατό. Ο
      φορολογικός έλεγχος των δύο προηγούμενων χρήσεων ολοκληρώθηκε χωρίς ουσιώδη ευρήματα. Τα
      στοιχεία της παρούσας έκθεσης δεν έχουν ελεγχθεί από ορκωτούς ελεγκτές και έχουν
      συνταχθεί με τις ίδιες λογιστικές αρχές που εφαρμόζονται στις ετήσιες καταστάσεις.
footer: |-
  Για την Οικονομική Διεύθυνση
  {lead}
