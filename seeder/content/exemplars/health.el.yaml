sections:
  - id: aitia
    heading: Αιτία προσέλευσης
    text: >-
      Προσέλευση στο τμήμα επειγόντων περιστατικών λόγω οπισθοστερνικού άλγους με αντανάκλαση
      στον αριστερό ώμο, διάρκειας σαράντα λεπτών, που συνοδευόταν από εφίδρωση και ναυτία. Το
      άλγος εμφανίστηκε σε ηρεμία και δεν υποχώρησε με την ανάπαυση. Δεν αναφέρεται δύσπνοια ή
      απώλεια συνείδησης.
  - id: istoriko
    heading: Ατομικό αναμνηστικό
    text: >-
      Αρτηριακή υπέρταση υπό αγωγή από δεκαετίας. Δυσλιπιδαιμία. Σακχαρώδης διαβήτης τύπου 2,
      ρυθμιζόμενος με δισκία. Κάπνισμα, ένα πακέτο ημερησίως επί τριάντα έτη. Χολοκυστεκτομή προ
      πενταετίας. Δεν αναφέρονται αλλεργίες σε φάρμακα. Κληρονομικό ιστορικό στεφανιαίας νόσου
      από την πλευρά του πατέρα.
  - id: exetasi
    heading: Κλινική εξέταση
    text: >-
      Αρτηριακή πίεση 150/90 mmHg, σφύξεις 88 ανά λεπτό, κορεσμός οξυγόνου 97% στον ατμοσφαιρικό
      αέρα, θερμοκρασία 36,7 °C. Καρδιακοί τόνοι ευκρινείς, ρυθμικοί, χωρίς φυσήματα.
      Αναπνευστικό ψιθύρισμα φυσιολογικό αμφοτερόπλευρα. Κοιλία μαλακή, ευπίεστη, ανώδυνη. Χωρίς
      οιδήματα κάτω άκρων.
  - id: ergastiriakos
    heading: Εργαστηριακός και απεικονιστικός έλεγχος
    text: >-
      Τροπονίνη υψηλής ευαισθησίας αυξημένη σε δύο διαδοχικές μετρήσεις. Γλυκόζη 172 mg/dL,
      κρεατινίνη 1,0 mg/dL, LDL χοληστερόλη 164 mg/dL. Το ηλεκτροκαρδιογράφημα έδειξε κατάσπαση
      του διαστήματος ST στις πλάγιες απαγωγές. Το υπερηχογράφημα καρδιάς ανέδειξε κλάσμα
      εξώθησης 50% με υποκινησία του πλαγίου τοιχώματος.
  - id: diagnosi
    heading: Διάγνωση
    text: >-
      Οξύ έμφραγμα του μυοκαρδίου χωρίς ανάσπαση του διαστήματος ST. Συνοδά νοσήματα: αρτηριακή
      υπέρταση, δυσλιπιδαιμία και σακχαρώδης διαβήτης τύπου 2. Η στεφανιογραφία ανέδειξε
      σημαντική στένωση της περισπωμένης αρτηρίας, χωρίς σημαντικές βλάβες στα υπόλοιπα αγγεία.
  - id: therapeia
    heading: Θεραπευτική αντιμετώπιση
    text: >-
      Χορηγήθηκε διπλή αντιαιμοπεταλιακή αγωγή και αντιπηκτική αγωγή. Τη δεύτερη ημέρα
      νοσηλείας διενεργήθηκε αγγειοπλαστική με τοποθέτηση ενδοστεφανιαίας πρόθεσης στην
      περισπωμένη αρτηρία, χωρίς επιπλοκές. Η μετεπεμβατική πορεία ήταν ομαλή και η έξοδος από τη
      μονάδα έγινε μετά από είκοσι τέσσερις ώρες παρακολούθησης.
  - id: agogi
    heading: Φαρμακευτική αγωγή εξόδου
    text: >-
      Ακετυλοσαλικυλικό οξύ 100 mg μία φορά ημερησίως. Κλοπιδογρέλη 75 mg μία φορά ημερησίως
      για δώδεκα μήνες. Ατορβαστατίνη 40 mg το βράδυ. Βισοπρολόλη 2,5 mg το πρωί. Ραμιπρίλη 5 mg
      το πρωί. Μετφορμίνη 850 mg δύο φορές ημερησίως. Η αγωγή δεν διακόπτεται χωρίς ιατρική
      οδηγία.
  - id: parakolouthisi
    heading: Παρακολούθηση
    text: >-
      Επανεξέταση στο καρδιολογικό ιατρείο σε έναν μήνα, με νέο έλεγχο λιπιδίων και νεφρικής
      λειτουργίας. Δοκιμασία κόπωσης σε τρεις μήνες. Συνιστάται ένταξη σε πρόγραμμα καρδιακής
      αποκατάστασης και παραπομπή σε διαβητολόγο για επανεκτίμηση της αντιδιαβητικής αγωγής.
  - id: odigies
    heading: Οδηγίες
    text: >-
      Οριστική διακοπή του καπνίσματος. Δίαιτα πτωχή σε κορεσμένα λιπαρά και αλάτι. Καθημερινό
      βάδισμα με σταδιακή αύξηση της διάρκειας. Αποφυγή άρσης βάρους για τέσσερις εβδομάδες.
      Άμεση προσέλευση στο νοσοκομείο σε περίπτωση επανεμφάνισης θωρακικού άλγους, δύσπνοιας ή
      αιμορραγίας.
  - id: ikanotita
    heading: Ικανότητα προς εργασία
    text: >-
      Συνιστάται αποχή από την εργασία για τριάντα ημέρες από την ημερομηνία εξόδου. Η
      βεβαίωση προς τον εργοδότη δεν αναγράφει τη διάγνωση. Η επάνοδος στην εργασία θα
      αποφασιστεί στην επανεξέταση, ανάλογα με το αποτέλεσμα της δοκιμασίας κόπωσης και τη φύση
      των καθηκόντων.
footer: |-
  Ο θεράπων ιατρός: {person2}
  Το παρόν περιέχει ευαίσθητα δεδομένα υγείας και χορηγείται στον ασθενή για κάθε νόμιμη χρήση.
