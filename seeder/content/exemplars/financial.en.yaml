kind: financial
category: FINANCIAL
language: en
numbered: false
titles:
  - "Management accounts: {quarter} {year}"
  - "Quarterly financial report to the board, {quarter} {year}"
  - "Financial performance review, {quarter} {year}"
header: |-
  {org_legal}
  Prepared by the finance department on {date}. For the board of directors and senior management only.
sections:
  - id: summary
    heading: Summary
    text: >-
      Turnover for the quarter was {amount3}, {percent}% higher than in the same quarter last
      year. Operating profit rose to {amount2}. Net profit after tax was {amount}, against a
      budget of {amount5}. The results reflect stronger sales in the domestic market and lower
      energy costs, partly offset by higher payroll.
  - id: revenue
    heading: Revenue
    text: >-
      Product sales contributed about two thirds of turnover and services the remainder. The
      ten largest customers accounted for {percent2}% of revenue. Average selling prices were
      stable, so the growth came from volume. Export sales fell slightly, because one
      distributor reduced its stock ahead of a change of warehouse.
  - id: costs
    heading: Cost of sales and gross margin
    text: >-
      Cost of sales increased more slowly than turnover, and gross margin improved to
      {percent2}%. Raw material prices were lower than budgeted, while freight costs were
      higher. Inventory write-downs of {rate2} were recorded for slow-moving items. No further
      write-downs are expected this year.
  - id: overheads
    heading: Operating expenses
    text: >-
      Administrative expenses were {amount4}, in line with budget. Staff costs grew after the
      annual pay review and four new hires in sales. Marketing spend was deferred to the next
      quarter. Depreciation was unchanged. Legal and professional fees included a one-off
      charge for the refinancing of the term loan.
  - id: cash
    heading: Cash flow
    text: >-
      Cash generated from operations was {amount2}. Capital expenditure of {amount5} related
      mainly to the new packaging line. The company repaid {amount} of bank debt and paid no
      dividend. Cash and cash equivalents at the end of the quarter stood at {amount3}, and the
      overdraft facility was not used.
  - id: working_capital
    heading: Working capital
    text: >-
      Trade receivables were {amount4} at the end of the quarter, equivalent to {days2} days of
      sales. Two customers account for most of the balance over ninety days, and a provision of
      {rate2} has been made. Trade payables were paid on average in {days} days. Inventory days
      fell by four.
  - id: balance_sheet
    heading: Balance sheet
    text: >-
      Total assets were broadly unchanged. Net debt fell to {amount5}, which is 1.4 times
      annualised EBITDA. Shareholders' equity increased by the retained profit for the
      quarter. The company is in compliance with the financial covenants of its loan
      agreements, with comfortable headroom on both the leverage and the interest cover tests.
  - id: budget
    heading: Variance against budget
    text: >-
      Turnover was ahead of budget by {percent}% and operating profit by a little more. The
      favourable variance came from volume and from energy prices. The adverse variances were
      freight, overtime in the warehouse and the delay in commissioning the new line, which
      postponed the expected saving in packaging cost.
  - id: outlook
    heading: Outlook
    text: >-
      The order book supports the full-year forecast, which management has raised slightly.
      The main uncertainties are raw material prices and the timing of two large tenders. A
      price increase of {percent}% will apply to new orders from next quarter. Capital
      expenditure for the year is expected to remain within the approved plan.
  - id: tax
    heading: Taxation and other matters
    text: >-
      The effective tax rate for the quarter was twenty-two per cent. The tax audit for the
      previous two financial years was completed without material findings. The statutory
      auditors will begin their interim work next month. These management accounts are
      unaudited and have been prepared on the same basis as the annual financial statements.
footer: |-
  Approved for circulation by {lead}, Chief Financial Officer.
