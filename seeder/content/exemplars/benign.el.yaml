language: el
intros:
  - "Θα ήθελα τη βοήθειά σου σε μερικά άσχετα μεταξύ τους θέματα. Ξεκινώ με το πρώτο."
  - "Έχω μερικές ερωτήσεις σήμερα και θα τις περιγράψω μία μία."
  - "Περισσότερα από ένα αιτήματα σε ένα μήνυμα, αν δεν σε πειράζει. Ακολουθεί το πρώτο."
bridges:
  - "Το δεύτερο θέμα είναι εντελώς διαφορετικό."
  - "Και τώρα το επόμενο αίτημα."
  - "Περνάω σε κάτι άλλο."
closers:
  - "Και κάτι τελευταίο, πιο σύντομο."
  - "Τέλος, μια μικρότερη ερώτηση."
  - "Και ένα τελευταίο, σύντομο αίτημα."
topics:
  - id: ekdromi
    paragraphs:
      - >-
        Σχεδιάζουμε ένα τριήμερο σε ορεινό χωριό τον Οκτώβριο, δύο ζευγάρια με αυτοκίνητο, και
        θα ήθελα ένα χαλαρό πρόγραμμα. Μας αρέσουν οι περίπατοι στη φύση, τα παραδοσιακά
        καφενεία και το καλό φαγητό. Προτιμάμε να δούμε λίγα μέρη με την ησυχία μας παρά να
        τρέχουμε από το ένα στο άλλο.
      - >-
        Για την πρώτη ημέρα σκέφτομαι να φτάσουμε το μεσημέρι, να φάμε σε μια ταβέρνα στην
        πλατεία και μετά να κάνουμε μια εύκολη διαδρομή σε μονοπάτι, όχι πάνω από δύο ώρες.
        Τι είδους αξιοθέατα αξίζει να αναζητήσουμε, όπως πέτρινα γεφύρια, μοναστήρια ή
        καταρράκτες;
      - >-
        Θα ήθελα επίσης μια λίστα με ρούχα και εξοπλισμό για φθινοπωρινό καιρό στο βουνό, έναν
        πρόχειρο προϋπολογισμό ανά άτομο για φαγητό και διαμονή, και μια ιδέα για το τι
        κάνουμε αν βρέξει όλο το απόγευμα. Κανείς μας δεν θέλει να οδηγεί το βράδυ.
  - id: fotosynthesi
    paragraphs:
      - >-
        Ο γιος μου πρέπει να παρουσιάσει στην τάξη του τη φωτοσύνθεση και μου ζήτησε βοήθεια.
        Πηγαίνει στην έκτη δημοτικού. Μπορείς να εξηγήσεις με απλά λόγια πώς τα φυτά φτιάχνουν
        την τροφή τους από το φως του ήλιου, το νερό και το διοξείδιο του άνθρακα;
      - >-
        Θα βοηθούσε ένα παράδειγμα από την καθημερινή ζωή για κάθε βήμα, όπως μια γλάστρα που
        μαραίνεται όταν μένει στο σκοτάδι. Πρότεινε επίσης ένα απλό σχέδιο που μπορεί να
        ζωγραφίσει σε χαρτόνι, με βέλη που δείχνουν τι μπαίνει στο φύλλο και τι βγαίνει από
        αυτό.
      - >-
        Τέλος, γράψε τρεις ερωτήσεις κουίζ που θα κάνει στους συμμαθητές του, μαζί με τις
        απαντήσεις, και ένα εντυπωσιακό στοιχείο για την αρχή της παρουσίασης. Κάτι για το πόσο
        οξυγόνο παράγει ένα μεγάλο δέντρο μέσα σε έναν χρόνο θα τους κέντριζε το ενδιαφέρον.
  - id: kodikas
    paragraphs:
      - >-
        Μαθαίνω JavaScript και έχω κολλήσει σε μια άσκηση. Έχω έναν πίνακα με αντικείμενα που
        το καθένα έχει όνομα και βαθμό, και θέλω να υπολογίσω τον μέσο όρο των βαθμών και να
        βρω ποιος έχει τον μεγαλύτερο. Ποιος είναι ο πιο καθαρός τρόπος να το γράψω;
      - >-
        Δοκίμασα με έναν βρόχο for και μια μεταβλητή που κρατάει το άθροισμα, και δουλεύει,
        αλλά διάβασα ότι υπάρχουν οι μέθοδοι map, filter και reduce. Μπορείς να μου δείξεις
        πώς γράφεται το ίδιο με reduce και να εξηγήσεις τι κάνει κάθε όρισμα της συνάρτησης;
      - >-
        Εξήγησέ μου ακόμη τι συμβαίνει όταν ο πίνακας είναι άδειος και πώς αποφεύγω τη
        διαίρεση με το μηδέν. Θα ήθελα επίσης να καταλάβω τη διαφορά ανάμεσα στο let και στο
        const, και πότε αξίζει να χρησιμοποιώ συναρτήσεις βέλους. Ένα μικρό παράδειγμα που
        τρέχει στον περιηγητή θα με βοηθούσε πολύ.
  - id: syntagi
    paragraphs:
      - >-
        Το Σάββατο έχω καλέσει έξι φίλους για φαγητό και θέλω ένα μενού που ετοιμάζεται κυρίως
        από την προηγούμενη ημέρα. Ένας καλεσμένος είναι χορτοφάγος και μία φίλη δεν τρώει
        γαλακτοκομικά. Σκέφτομαι μια σαλάτα για αρχή, ένα φαγητό φούρνου και ένα γλυκό
        ψυγείου.
      - >-
        Για κυρίως πιάτο μου αρέσει η ιδέα για γεμιστά με ρύζι και μυρωδικά, που τα τρώνε
        όλοι. Δώσε μου τις ποσότητες για έξι άτομα, τη θερμοκρασία και τον χρόνο ψησίματος,
        και πες μου αν είναι προτιμότερο να σερβιριστούν ζεστά ή σε θερμοκρασία δωματίου.
      - >-
        Πρότεινε ένα ορεκτικό και ένα επιδόρπιο που ταιριάζουν, μια λίστα για τα ψώνια
        χωρισμένη ανά διάδρομο του σούπερ μάρκετ και ένα χρονοδιάγραμμα για την ημέρα, ώστε να
        μη βρίσκομαι στην κουζίνα όταν φτάσουν οι καλεσμένοι. Χρειάζομαι και μια ιδέα για
        αναψυκτικό χωρίς αλκοόλ.
  - id: akropoli
    paragraphs:
      - >-
        Γράφω ένα σύντομο άρθρο για την εφημερίδα του συλλόγου μας με θέμα την ιστορία της
        Ακρόπολης των Αθηνών και θέλω να βεβαιωθώ ότι έχω σωστά τα βασικά. Μπορείς να
        συνοψίσεις πότε χτίστηκε ο Παρθενώνας, ποιοι τον σχεδίασαν και τι σκοπό εξυπηρετούσε
        στην αρχαιότητα;
      - >-
        Στη συνέχεια θα ήθελα μία παράγραφο για τα υπόλοιπα μνημεία του βράχου, τα Προπύλαια,
        το Ερέχθειο και τον ναό της Αθηνάς Νίκης, και λίγα λόγια για το πώς άλλαξε η χρήση του
        χώρου στους αιώνες που ακολούθησαν, μέχρι τις σύγχρονες εργασίες αναστήλωσης.
      - >-
        Για το κλείσιμο χρειάζομαι δύο τρεις πρακτικές πληροφορίες για όποιον θέλει να
        επισκεφθεί τον χώρο με παιδιά, γραμμένες σε φιλικό ύφος. Το κείμενο να έχει συνολικά
        γύρω στις τετρακόσιες λέξεις και έναν τίτλο που να τραβάει την προσοχή.
  - id: gymnastiki
    paragraphs:
      - >-
        Έχω χρόνια να γυμναστώ συστηματικά και θέλω να ξαναρχίσω με μέτρο. Είμαι σαράντα πέντε
        ετών, κάνω δουλειά γραφείου και μπορώ να διαθέσω μισή ώρα τρεις φορές την εβδομάδα.
        Πρότεινέ μου ένα πρόγραμμα για αρχάριους για τις πρώτες οκτώ εβδομάδες, χωρίς όργανα
        και χωρίς γυμναστήριο.
      - >-
        Θα ήθελα συνδυασμό από γρήγορο περπάτημα, απλές ασκήσεις ενδυνάμωσης, όπως βαθιά
        καθίσματα και κάμψεις στον τοίχο, και λίγες διατάσεις στο τέλος. Πες μου με πόσες
        επαναλήψεις να ξεκινήσω, πώς γίνεται κάθε άσκηση πιο εύκολη ή πιο δύσκολη και πόσο
        γρήγορα να ανεβάζω την ένταση.
      - >-
        Χρήσιμες θα ήταν και μερικές συμβουλές για το ζέσταμα, για το ποιος μυϊκός πόνος είναι
        φυσιολογικός και ποιος σημαίνει ότι πρέπει να σταματήσω, καθώς και για το πώς δεν θα
        τα παρατήσω τον χειμώνα. Ένας απλός πίνακας που τυπώνεται και συμπληρώνεται μετά από
        κάθε προπόνηση θα ήταν ιδανικός.
  - id: mpalkoni
    paragraphs:
      - >-
        Έχω ένα μικρό μπαλκόνι με νότιο προσανατολισμό στον τρίτο όροφο και θέλω να φυτέψω
        αρωματικά και λίγα λαχανικά το καλοκαίρι. Το χτυπάει δυνατός ήλιος από το μεσημέρι και
        συχνά φυσάει. Ποια φυτά αντέχουν σε γλάστρα και τι μέγεθος γλάστρας χρειάζονται;
      - >-
        Σκεφτόμουν βασιλικό, δυόσμο, δεντρολίβανο, ντοματίνια και ίσως πιπεριές. Ποια από αυτά
        μπορούν να μοιραστούν την ίδια ζαρντινιέρα, πόσο συχνά θέλουν πότισμα στη ζέστη, και
        είναι καλύτερα να αγοράσω έτοιμα φυτά ή να ξεκινήσω από σπόρο αυτή την εποχή;
      - >-
        Γράψε μου και τις εργασίες κάθε μήνα από τον Απρίλιο μέχρι τον Σεπτέμβριο, συμβουλές
        για τη λίπανση και για την αντιμετώπιση της μελίγκρας χωρίς χημικά, και μια ιδέα για
        σκίαση στον καύσωνα. Είμαι εντελώς αρχάρια, οπότε προτιμώ απλές οδηγίες.
  - id: anatokismos
    paragraphs:
      - >-
        Μπορείς να μου εξηγήσεις τον ανατοκισμό σαν να μιλούσες σε έφηβο; Καταλαβαίνω ότι η
        τράπεζα δίνει τόκο για τα χρήματα ενός λογαριασμού ταμιευτηρίου, αλλά δεν βλέπω γιατί
        λένε ότι έχει τόση σημασία να ξεκινά κανείς νωρίς. Ένα παράδειγμα με στρογγυλά νούμερα
        θα το έκανε πιο σαφές.
      - >-
        Ας πούμε ότι κάποιος αποταμιεύει εκατό ευρώ τον μήνα επί δέκα χρόνια με επιτόκιο
        τέσσερα τοις εκατό, και κάποιος άλλος το ίδιο ποσό επί είκοσι χρόνια. Πόσα έχει
        καταθέσει ο καθένας και πόσα έχει στο τέλος; Δείξε μου τα βήματα και όχι μόνο το
        αποτέλεσμα.
      - >-
        Έχω ακούσει και για τον κανόνα του εβδομήντα δύο, με τον οποίο υπολογίζεις σε πόσα
        χρόνια διπλασιάζεται ένα ποσό. Είναι ακριβής και από πού προκύπτει; Τέλος, πώς αλλάζει
        την εικόνα ο πληθωρισμός, και ποια είναι η διαφορά ανάμεσα στην ονομαστική και στην
        πραγματική απόδοση;
