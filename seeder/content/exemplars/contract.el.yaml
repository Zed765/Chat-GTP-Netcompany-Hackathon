kind: contract
category: CONTRACT
language: el
numbered: true
titles:
  - Ιδιωτικό Συμφωνητικό Προμήθειας και Εγκατάστασης Εξοπλισμού
  - Σύμβαση Έργου
  - Σύμβαση Προμήθειας Αγαθών και Παροχής Υπηρεσιών
header: |-
  Στην Αθήνα, σήμερα {date}, οι κάτωθι συμβαλλόμενοι: αφενός η εταιρεία με την επωνυμία {org_legal}, που εδρεύει στη διεύθυνση {org_address}, με ΑΦΜ {org_afm}, νόμιμα εκπροσωπούμενη (εφεξής ο «Προμηθευτής»), και αφετέρου η εταιρεία με την επωνυμία {client:legal}, που εδρεύει στη διεύθυνση {client_address}, με ΑΦΜ {client_afm}, νόμιμα εκπροσωπούμενη (εφεξής ο «Αγοραστής»), συμφώνησαν, συνομολόγησαν και συναποδέχθηκαν τα εξής.
sections:
  - id: antikeimeno
    heading: Αντικείμενο της σύμβασης
    text: >-
      Ο Προμηθευτής αναλαμβάνει την υποχρέωση να προμηθεύσει, να παραδώσει και να εγκαταστήσει
      στον Αγοραστή τον εξοπλισμό που περιγράφεται αναλυτικά στο Παράρτημα Α, το οποίο αποτελεί
      αναπόσπαστο μέρος της παρούσας. Ο εξοπλισμός θα είναι καινούργιος, αμεταχείριστος και
      σύμφωνος με τις τεχνικές προδιαγραφές του κατασκευαστή.
  - id: timima
    heading: Τίμημα και όροι πληρωμής
    text: >-
      Το συνολικό τίμημα συμφωνείται σε {amount} πλέον του αναλογούντος ΦΠΑ. Ποσοστό {percent}%
      καταβάλλεται ως προκαταβολή με την υπογραφή της παρούσας και το υπόλοιπο εντός {days}
      ημερών από την οριστική παραλαβή, έναντι νόμιμου τιμολογίου. Το τίμημα είναι σταθερό και
      δεν υπόκειται σε αναθεώρηση για οποιονδήποτε λόγο.
  - id: paradosi
    heading: Χρόνος και τόπος παράδοσης
    text: >-
      Η παράδοση και η εγκατάσταση του εξοπλισμού θα ολοκληρωθούν το αργότερο έως τις
      {end_date}, στις εγκαταστάσεις του Αγοραστή. Για κάθε ημέρα υπαίτιας καθυστέρησης ο
      Προμηθευτής οφείλει ποινική ρήτρα ίση με ένα τοις χιλίοις του τιμήματος, με ανώτατο όριο το
      πέντε τοις εκατό αυτού.
  - id: paralavi
    heading: Παραλαβή
    text: >-
      Μετά την εγκατάσταση διενεργείται δοκιμαστική λειτουργία διάρκειας δέκα εργάσιμων ημερών.
      Εφόσον δεν διαπιστωθούν ελαττώματα, τα μέρη υπογράφουν πρωτόκολλο οριστικής παραλαβής. Αν
      διαπιστωθούν ελλείψεις, ο Προμηθευτής υποχρεούται να τις αποκαταστήσει εντός εύλογης
      προθεσμίας, που ορίζεται εγγράφως από τον Αγοραστή.
  - id: eggyisi
    heading: Εγγύηση καλής λειτουργίας
    text: >-
      Ο Προμηθευτής εγγυάται την καλή λειτουργία του εξοπλισμού για χρονικό διάστημα {months}
      μηνών από την οριστική παραλαβή. Κατά τη διάρκεια της εγγύησης αποκαθιστά δωρεάν κάθε
      βλάβη που δεν οφείλεται σε κακή χρήση, με δικά του ανταλλακτικά και προσωπικό, εντός δύο
      εργάσιμων ημερών από την ειδοποίησή του.
  - id: echemytheia
    heading: Εμπιστευτικότητα
    text: >-
      Οι συμβαλλόμενοι αναλαμβάνουν την υποχρέωση να τηρούν απόρρητες όλες τις πληροφορίες
      εμπορικής, τεχνικής ή οικονομικής φύσης που περιέρχονται σε γνώση τους με αφορμή την
      παρούσα σύμβαση και να μην τις χρησιμοποιούν για σκοπό άλλον από την εκτέλεσή της. Η
      υποχρέωση αυτή διατηρείται σε ισχύ επί {years} έτη μετά τη λήξη της σύμβασης.
  - id: efthyni
    heading: Ευθύνη και αποζημίωση
    text: >-
      Κάθε συμβαλλόμενος ευθύνεται έναντι του άλλου για κάθε θετική ζημία που προκαλείται από
      υπαίτια παράβαση των όρων της παρούσας. Η συνολική ευθύνη του Προμηθευτή δεν μπορεί να
      υπερβεί το ύψος του συμβατικού τιμήματος. Ο περιορισμός αυτός δεν ισχύει σε περίπτωση δόλου
      ή βαριάς αμέλειας.
  - id: lysi
    heading: Καταγγελία και λύση της σύμβασης
    text: >-
      Όλοι οι όροι της παρούσας συνομολογούνται ουσιώδεις. Η παράβαση οποιουδήποτε από αυτούς
      παρέχει στον αναίτιο συμβαλλόμενο το δικαίωμα να καταγγείλει τη σύμβαση, αφού προηγουμένως
      τάξει στον άλλο εύλογη προθεσμία συμμόρφωσης δεκαπέντε ημερών, και να αξιώσει αποζημίωση
      για κάθε ζημία του.
  - id: anotera_via
    heading: Ανωτέρα βία
    text: >-
      Οι συμβαλλόμενοι δεν ευθύνονται για τη μη εκπλήρωση των συμβατικών τους υποχρεώσεων, στο
      μέτρο που αυτή οφείλεται σε περιστατικά ανωτέρας βίας. Ο συμβαλλόμενος που τα επικαλείται
      οφείλει να τα γνωστοποιήσει εγγράφως στον άλλο και να προσκομίσει τα αναγκαία αποδεικτικά
      στοιχεία εντός δέκα ημερών από την επέλευσή τους.
  - id: telikes
    heading: Τελικές διατάξεις
    text: >-
      Η παρούσα σύμβαση αποτελεί τη μόνη συμφωνία μεταξύ των μερών για το αντικείμενό της και
      καταργεί κάθε προηγούμενη συμφωνία, έγγραφη ή προφορική. Κάθε τροποποίησή της γίνεται μόνο
      εγγράφως. Η τυχόν ακυρότητα ενός όρου δεν επηρεάζει το κύρος των λοιπών. Η εκχώρηση
      δικαιωμάτων σε τρίτους απαγορεύεται χωρίς έγγραφη συναίνεση.
  - id: dikaiodosia
    heading: Εφαρμοστέο δίκαιο και δωσιδικία
    text: >-
      Η παρούσα διέπεται από το ελληνικό δίκαιο. Για την επίλυση κάθε διαφοράς που απορρέει από
      αυτήν αρμόδια ορίζονται τα καθ' ύλην αρμόδια δικαστήρια της έδρας του Προμηθευτή. Σε
      πίστωση των ανωτέρω συντάχθηκε το παρόν σε δύο όμοια πρωτότυπα και κάθε συμβαλλόμενος
      έλαβε από ένα.
footer: |-
  ΟΙ ΣΥΜΒΑΛΛΟΜΕΝΟΙ
  Για τον Προμηθευτή: {lead}
  Για τον Αγοραστή: {contact}
