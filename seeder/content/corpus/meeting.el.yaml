kind: meeting
category: CLIENT_CONFIDENTIAL
language: el
numbered: true
titles:
  - "Πρακτικά συνάντησης: τριμηνιαία ανασκόπηση με {client:acc}"
  - "Πρακτικά συνάντησης: πορεία έργου {project} για {client:acc}"
  - "Σημειώσεις συνάντησης με {client:acc}"
header: |-
  Ημερομηνία: {date}
  Συμμετέχοντες ({org}): {lead}, {lead2}
  Συμμετέχοντες ({client}): {contact}
  Έργο: {project} ({project_code})
  Τήρηση πρακτικών: {lead2}. Για εσωτερική χρήση μόνο· δεν αποστέλλονται στον πελάτη.
sections:
  - id: poreia
    heading: Πορεία εργασιών
    text: >-
      {lead:Nom} ενημέρωσε ότι η μετάπτωση του πελατολογίου έχει ολοκληρωθεί κατά {percent2}%. Ο
      καθαρισμός των διπλών εγγραφών τελείωσε μία εβδομάδα νωρίτερα από το πρόγραμμα. Εκκρεμεί η
      διασύνδεση με το λογιστικό πρόγραμμα, επειδή ο προμηθευτής του δεν έχει παραδώσει ακόμη τα
      στοιχεία πρόσβασης. {contact:Nom} δεσμεύτηκε να πιέσει τον προμηθευτή.
  - id: exypiretisi
    heading: Ποιότητα εξυπηρέτησης
    text: >-
      Στο τρίμηνο καταγράφηκαν {days2} αιτήματα υποστήριξης, από τα οποία δύο κρίσιμα. Ο χρόνος
      απόκρισης τηρήθηκε σε όλα εκτός από ένα, που καθυστέρησε τρεις ώρες λόγω αργίας. Ο πελάτης
      δεν ζήτησε την έκπτωση που προβλέπει η σύμβαση. Συμφωνήσαμε να μην το θίξουμε εμείς, αλλά
      να το καταγράψουμε εσωτερικά.
  - id: oikonomika
    heading: Οικονομικά
    text: >-
      Το τιμολόγιο του προηγούμενου μήνα παραμένει ανεξόφλητο εδώ και {days} ημέρες. {contact:Nom}
      ανέφερε ότι έχει εγκριθεί και ότι η πληρωμή θα γίνει από τον λογαριασμό {client_iban} στο
      επόμενο πρόγραμμα πληρωμών. Το ανεξόφλητο υπόλοιπο είναι {amount4}. Δεν θα σταλεί επίσημη
      όχληση πριν από το τέλος του μήνα.
  - id: ananeosi
    heading: Ανανέωση σύμβασης
    text: >-
      Η σύμβαση λήγει στις {end_date}. Ο πελάτης άφησε να εννοηθεί ότι θα ζητήσει μείωση της
      αμοιβής κατά {percent}%. Δεν απαντήσαμε στη συνάντηση. Η θέση μας, όπως τη συμφωνήσαμε
      αμέσως μετά, είναι να διατηρηθεί η μηνιαία αμοιβή των {rate} και να προταθεί τριετής
      ανανέωση με σταθερή τιμή. Το θέμα δεν συζητείται με τον πελάτη εκτός της ομάδας του
      λογαριασμού.
  - id: nees_anagkes
    heading: Νέες ανάγκες του πελάτη
    text: >-
      Ο πελάτης ενδιαφέρεται για αυτόματη αποστολή μηνυμάτων στους δικούς του πελάτες όταν
      αλλάζει η κατάσταση ενός αιτήματος. Η εργασία δεν περιλαμβάνεται στη σύμβαση. Εκτιμούμε
      ότι αξίζει περίπου {amount5} και θα υποβάλουμε προσφορά μετά την ολοκλήρωση της
      μετάπτωσης, ώστε να μη συνδεθεί με τη διαπραγμάτευση της ανανέωσης.
  - id: prosopiko
    heading: Θέματα προσωπικού
    text: >-
      Ο υπεύθυνος μηχανογράφησης του πελάτη αποχωρεί στο τέλος του μήνα και δεν έχει οριστεί
      αντικαταστάτης. Είναι το πρόσωπο που γνωρίζει καλύτερα το παλιό σύστημα, επομένως η
      αποχώρησή του αυξάνει τον κίνδυνο καθυστέρησης. Από τη δική μας πλευρά, η ομάδα παραμένει
      ίδια μέχρι την παράδοση, και η άδεια του Αυγούστου έχει ήδη καλυφθεί.
  - id: asfaleia
    heading: Πρόσβαση και ασφάλεια
    text: >-
      Δύο λογαριασμοί της ομάδας μας στα συστήματα του πελάτη έχουν ακόμη δικαιώματα
      διαχειριστή. Συμφωνήθηκε να περιοριστούν μέχρι την Παρασκευή. {lead2:Nom} επιβεβαίωσε ότι
      κανένα στοιχείο πελατών δεν έχει αντιγραφεί εκτός του περιβάλλοντος του πελάτη και ότι το
      δοκιμαστικό αντίγραφο περιέχει μόνο αλλοιωμένα προσωπικά στοιχεία.
  - id: parapona
    heading: Παράπονα και εκκρεμότητες
    text: >-
      Ο πελάτης παραπονέθηκε ότι οι μηνιαίες αναφορές φτάνουν με καθυστέρηση. Αναγνωρίσαμε το
      πρόβλημα· οφείλεται σε χειροκίνητο βήμα που θα αυτοματοποιηθεί τον επόμενο μήνα. Εκκρεμεί
      επίσης η εκπαίδευση δύο νέων χρηστών του τμήματος πωλήσεων, που θα γίνει εξ αποστάσεως
      μέσα στο επόμενο δεκαπενθήμερο.
  - id: programma
    heading: Πρόγραμμα επόμενου διαστήματος
    text: >-
      Ολοκλήρωση της διασύνδεσης με το λογιστικό πρόγραμμα, δοκιμές αποδοχής από έναν χρήστη
      κάθε τμήματος και δοκιμαστική μετάπτωση σε αντίγραφο των δεδομένων. Η οριστική μετάπτωση
      προγραμματίζεται για Σαββατοκύριακο, μετά από γραπτή έγκριση του πελάτη. Αν οι δοκιμές
      αναδείξουν σοβαρά προβλήματα, η ημερομηνία μετατίθεται κατά δύο εβδομάδες.
  - id: energeies
    heading: Ενέργειες
    text: >-
      Πελάτης ({contact}): στοιχεία πρόσβασης από τον προμηθευτή και ορισμός αντικαταστάτη.
      {lead}: σχέδιο πρότασης ανανέωσης για εσωτερική έγκριση. {lead2}: περιορισμός των
      λογαριασμών διαχειριστή και αποστολή της αναφοράς ποιότητας δεδομένων. Λογιστήριο:
      υπενθύμιση για το τιμολόγιο, αν δεν εξοφληθεί, στη διεύθυνση {client_email}. Επόμενη
      συνάντηση σε έναν μήνα.
footer: |-
  Διανομή: μόνο η ομάδα του λογαριασμού.
