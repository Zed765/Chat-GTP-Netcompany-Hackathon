kind: contract
category: CONTRACT
language: el
numbered: true
titles:
  - "Σύμβαση Παροχής Υπηρεσιών Υποστήριξης με {client:acc}"
  - "Ιδιωτικό Συμφωνητικό Παροχής Υπηρεσιών με {client:acc}"
  - "Σύμβαση Τεχνικής Υποστήριξης και Συντήρησης με {client:acc}"
header: |-
  Αριθμός σύμβασης: {reference}

  Στην Αθήνα, σήμερα {date}, μεταξύ αφενός της εταιρείας με την επωνυμία {org_legal}, που εδρεύει στη διεύθυνση {org_address}, με ΑΦΜ {org_afm} (εφεξής ο «Ανάδοχος»), και αφετέρου {client:gen_legal}, με διεύθυνση {client_address} και ΑΦΜ {client_afm} (εφεξής ο «Πελάτης»), με εκπρόσωπο για την παρούσα {contact:acc}, συμφωνούνται και γίνονται αμοιβαία αποδεκτά τα ακόλουθα.
sections:
  - id: antikeimeno
    heading: Αντικείμενο
    text: >-
      Ο Ανάδοχος αναλαμβάνει να παρέχει στον Πελάτη υπηρεσίες τεχνικής υποστήριξης και συντήρησης
      για τα συστήματα που παραδόθηκαν στο πλαίσιο του έργου {project} (κωδικός {project_code}).
      Οι υπηρεσίες περιλαμβάνουν τη διόρθωση σφαλμάτων, την εγκατάσταση ενημερώσεων ασφαλείας και
      την απάντηση σε ερωτήματα των χρηστών. Νέες λειτουργίες δεν καλύπτονται από την παρούσα και
      συμφωνούνται χωριστά.
  - id: diarkeia
    heading: Διάρκεια
    text: >-
      Η σύμβαση αρχίζει στις {start_date} και έχει διάρκεια {months} μηνών. Μετά τη λήξη της
      ανανεώνεται αυτομάτως για ένα ακόμη έτος κάθε φορά, εκτός αν ένα από τα μέρη δηλώσει
      εγγράφως, τουλάχιστον {days} ημέρες πριν από τη λήξη, ότι δεν επιθυμεί την ανανέωση. Η
      σιωπηρή παράταση για μικρότερο διάστημα αποκλείεται.
  - id: amoivi
    heading: Αμοιβή και τρόπος πληρωμής
    text: >-
      Η μηνιαία αμοιβή του Αναδόχου ορίζεται σε {rate} πλέον ΦΠΑ και το συνολικό ετήσιο τίμημα
      δεν υπερβαίνει τα {amount}. Το τιμολόγιο εκδίδεται την πρώτη εργάσιμη ημέρα κάθε μήνα και
      εξοφλείται εντός {days} ημερών με έμβασμα από τον λογαριασμό {client_iban}. Σε περίπτωση
      καθυστέρησης οφείλεται τόκος υπερημερίας {percent}% ετησίως, χωρίς άλλη όχληση.
    paraphrase: >-
      Ο Ανάδοχος αμείβεται με {rate} τον μήνα, ποσό στο οποίο προστίθεται ο ΦΠΑ, και σε ένα έτος
      δεν μπορεί να εισπράξει συνολικά πάνω από {amount}. Κάθε μήνα, την πρώτη εργάσιμη, κόβεται
      τιμολόγιο, το οποίο ο Πελάτης πληρώνει μέσα σε {days} ημέρες με μεταφορά από τον λογαριασμό
      {client_iban}. Αν η πληρωμή αργήσει, χρεώνεται αυτοδικαίως τόκος {percent}% τον χρόνο.
  - id: epipeda
    heading: Επίπεδα εξυπηρέτησης
    text: >-
      Ο Ανάδοχος απαντά σε κρίσιμα περιστατικά εντός δύο ωρών και σε όλα τα υπόλοιπα εντός μίας
      εργάσιμης ημέρας. Κρίσιμο θεωρείται το περιστατικό που διακόπτει τη λειτουργία του
      συστήματος για το σύνολο των χρηστών. Αν σε έναν μήνα ο χρόνος απόκρισης ξεπεραστεί σε
      περισσότερα από τρία περιστατικά, ο Πελάτης δικαιούται έκπτωση {percent}% στην αμοιβή του
      μήνα αυτού.
    translation: >-
      The Contractor responds to critical incidents within two hours and to all others within
      one working day. An incident is critical when it stops the system from working for every
      user. If the response time is exceeded for more than three incidents in one month, the
      Client is entitled to a discount of {percent}% on the fee for that month.
    paraphrase: >-
      Για τα κρίσιμα περιστατικά, δηλαδή όσα αφήνουν όλους τους χρήστες χωρίς σύστημα, η
      απόκριση του Αναδόχου δίνεται μέσα σε δύο ώρες· για τα άλλα, μέσα σε μία εργάσιμη ημέρα.
      Όταν μέσα στον ίδιο μήνα η προθεσμία αυτή χαθεί σε τέσσερα ή περισσότερα περιστατικά, η
      αμοιβή του μήνα μειώνεται κατά {percent}% υπέρ του Πελάτη.
  - id: ypochreoseis
    heading: Υποχρεώσεις του Πελάτη
    text: >-
      Ο Πελάτης ορίζει ένα πρόσωπο επικοινωνίας, το οποίο συγκεντρώνει και προωθεί τα αιτήματα
      των χρηστών. Παρέχει στον Ανάδοχο απομακρυσμένη πρόσβαση στα συστήματα, τηρεί αντίγραφα
      ασφαλείας των δεδομένων του και ενημερώνει εγκαίρως για κάθε αλλαγή στην υποδομή του.
      Καθυστερήσεις που οφείλονται σε έλλειψη πρόσβασης δεν υπολογίζονται στους χρόνους
      απόκρισης.
    translation: >-
      The Client appoints one contact person, who collects and forwards the users' requests. It
      gives the Contractor remote access to the systems, keeps backups of its own data and gives
      early notice of any change to its infrastructure. Delays caused by a lack of access do not
      count towards the response times.
  - id: omada
    heading: Ομάδα έργου
    text: >-
      Την ευθύνη της σύμβασης για τον Ανάδοχο έχει {lead:nom} και την καθημερινή επικοινωνία
      αναλαμβάνει {lead2:nom}. Από την πλευρά του Πελάτη, τα αιτήματα εγκρίνει {contact:nom}. Τα
      μέρη συναντώνται μία φορά το τρίμηνο για να εξετάσουν τα ανοιχτά ζητήματα και την ποιότητα
      των υπηρεσιών, και τηρούν σύντομα πρακτικά κάθε συνάντησης.
  - id: echemytheia
    heading: Εχεμύθεια
    text: >-
      Τα μέρη δεσμεύονται να μην αποκαλύπτουν σε τρίτους πληροφορίες που περιήλθαν σε γνώση τους
      κατά την εκτέλεση της σύμβασης, όπως τεχνικά στοιχεία, κωδικούς πρόσβασης, τιμές και
      στοιχεία συναλλασσομένων. Η υποχρέωση αυτή δεσμεύει και το προσωπικό και τους συνεργάτες
      κάθε μέρους, και εξακολουθεί να ισχύει για {years} έτη μετά τη λήξη ή τη λύση της σύμβασης
      για οποιονδήποτε λόγο.
    paraphrase: >-
      Ό,τι μαθαίνει το ένα μέρος για το άλλο όσο εκτελείται η σύμβαση (τεχνικές λεπτομέρειες,
      κωδικοί πρόσβασης, τιμοκατάλογοι, στοιχεία πελατών και προμηθευτών) δεν γνωστοποιείται σε
      κανέναν τρίτο. Την ίδια δέσμευση έχουν οι εργαζόμενοι και οι εξωτερικοί συνεργάτες των
      μερών. Η δέσμευση δεν παύει με το τέλος της σύμβασης, αλλά συνεχίζεται επί {years} έτη.
  - id: dedomena
    heading: Προστασία προσωπικών δεδομένων
    text: >-
      Κατά την παροχή των υπηρεσιών ο Ανάδοχος ενδέχεται να αποκτήσει πρόσβαση σε προσωπικά
      δεδομένα πελατών και εργαζομένων του Πελάτη. Τα επεξεργάζεται αποκλειστικά για τον σκοπό
      της υποστήριξης, δεν τα αντιγράφει εκτός των συστημάτων του Πελάτη και τα διαγράφει μόλις
      κλείσει το σχετικό αίτημα. Κάθε περιστατικό παραβίασης γνωστοποιείται στον Πελάτη εντός
      είκοσι τεσσάρων ωρών.
  - id: efthyni
    heading: Ευθύνη
    text: >-
      Ο Ανάδοχος ευθύνεται για κάθε ζημία που οφείλεται σε δόλο ή βαριά αμέλεια του προσωπικού
      του. Για ελαφρά αμέλεια η ευθύνη του περιορίζεται στο ποσό των αμοιβών που εισέπραξε κατά
      τους τελευταίους δώδεκα μήνες και σε κάθε περίπτωση δεν υπερβαίνει τα {cap}. Αποκλείεται η
      ευθύνη για διαφυγόντα κέρδη και για απώλεια δεδομένων που δεν είχαν αντίγραφο ασφαλείας.
  - id: anotera_via
    heading: Ανωτέρα βία
    text: >-
      Κανένα μέρος δεν ευθύνεται για τη μη εκπλήρωση υποχρεώσεών του, εφόσον αυτή οφείλεται σε
      γεγονός ανωτέρας βίας, όπως φυσική καταστροφή, γενική διακοπή ρεύματος ή δικτύου, απεργία ή
      πράξη δημόσιας αρχής. Το μέρος που επικαλείται το γεγονός ειδοποιεί το άλλο εντός τριών
      ημερών. Αν το εμπόδιο διαρκέσει πάνω από δύο μήνες, κάθε μέρος μπορεί να λύσει τη σύμβαση
      αζημίως.
    translation: >-
      Neither party is liable for failing to perform its obligations where the failure is due
      to force majeure, such as a natural disaster, a general power or network outage, a strike
      or an act of a public authority. The party relying on the event notifies the other within
      three days. If the obstacle lasts more than two months, either party may end the contract
      without penalty.
  - id: katangelia
    heading: Καταγγελία
    text: >-
      Κάθε μέρος μπορεί να καταγγείλει τη σύμβαση οποτεδήποτε, με έγγραφη προειδοποίηση {days}
      ημερών. Αν το άλλο μέρος παραβεί ουσιώδη όρο και δεν συμμορφωθεί εντός δέκα ημερών από τη
      σχετική όχληση, η καταγγελία έχει άμεσο αποτέλεσμα. Ως ουσιώδεις ορίζονται οι όροι για την
      αμοιβή, την εχεμύθεια και την προστασία των προσωπικών δεδομένων.
    paraphrase: >-
      Η σύμβαση λύνεται με καταγγελία από οποιοδήποτε μέρος, αρκεί να έχει προηγηθεί γραπτή
      ειδοποίηση {days} ημερών. Δεν χρειάζεται προθεσμία όταν ο αντισυμβαλλόμενος έχει αθετήσει
      ουσιώδη όρο και, παρά την όχληση, δεν έχει επανορθώσει μέσα σε δέκα ημέρες. Ουσιώδεις είναι
      οι όροι που αφορούν την πληρωμή, το απόρρητο και τα προσωπικά δεδομένα.
  - id: dikaio
    heading: Εφαρμοστέο δίκαιο και δικαιοδοσία
    text: >-
      Η σύμβαση διέπεται από το ελληνικό δίκαιο. Για κάθε διαφορά που θα προκύψει από την
      ερμηνεία ή την εκτέλεσή της, τα μέρη θα επιδιώξουν πρώτα φιλική επίλυση εντός τριάντα
      ημερών. Αν αυτή δεν επιτευχθεί, αρμόδια είναι αποκλειστικά τα δικαστήρια των Αθηνών. Κάθε
      τροποποίηση της σύμβασης αποδεικνύεται μόνο εγγράφως.
footer: |-
  Για τον Ανάδοχο: {lead}
  Για τον Πελάτη: {contact}
  Ηλεκτρονική διεύθυνση για κοινοποιήσεις: {client_email}
