kind: financial
category: FINANCIAL
language: el
numbered: false
titles:
  - "Οικονομική σύνοψη λογαριασμού: {client}, {quarter} {year}"
  - "Τριμηνιαία ανασκόπηση τιμολογήσεων και εισπράξεων: {client}"
  - "Απολογισμός εσόδων ανά πελάτη, {quarter} {year}: {client}"
header: |-
  Εσωτερικό έγγραφο. Αποκλειστικά για τη Διεύθυνση Οικονομικών.
  Πελάτης: {client:legal} (ΑΦΜ {client_afm})
  Υπεύθυνος λογαριασμού: {lead}
  Σύνταξη: {lead2}, {date}
  Έργο: {project} ({project_code})
sections:
  - id: synopsi
    heading: Βασικά μεγέθη
    text: >-
      Τα έσοδα από τον πελάτη στο {quarter} του {year} ανήλθαν σε {amount}, έναντι στόχου
      {amount2}. Το μικτό περιθώριο διαμορφώθηκε στο {percent2}%. Από την αρχή του έτους τα
      έσοδα φτάνουν τα {amount3}, αυξημένα σε σχέση με την αντίστοιχη περίοδο πέρυσι. Ο πελάτης
      παραμένει στους δέκα μεγαλύτερους της εταιρείας.
    paraphrase: >-
      Στο {quarter} του {year} ο πελάτης απέφερε έσοδα {amount}, ενώ ο στόχος ήταν {amount2}, με
      μικτό περιθώριο {percent2}%. Αθροιστικά από τον Ιανουάριο τα έσοδα έχουν φτάσει τα
      {amount3}, δηλαδή περισσότερα από όσα είχαν καταγραφεί στο ίδιο διάστημα της περσινής
      χρονιάς. Εξακολουθεί να συγκαταλέγεται στους δέκα μεγαλύτερους πελάτες μας.
  - id: timologiseis
    heading: Τιμολογήσεις
    text: >-
      Στο τρίμηνο εκδόθηκαν τρία τιμολόγια παροχής υπηρεσιών συνολικής αξίας {amount}. Τα δύο
      αφορούν τη μηνιαία συντήρηση και το τρίτο πρόσθετες εργασίες που ενέκρινε {contact:nom}.
      Ένα πιστωτικό τιμολόγιο αξίας {rate2} εκδόθηκε για την έκπτωση που προβλέπει η σύμβαση
      όταν δεν τηρούνται οι χρόνοι απόκρισης.
  - id: eispraxeis
    heading: Εισπράξεις και υπόλοιπα
    text: >-
      Το ανεξόφλητο υπόλοιπο στο τέλος του τριμήνου είναι {amount4}. Το τιμολόγιο του
      προηγούμενου μήνα έχει καθυστερήσει {days} ημέρες. Το λογιστήριο του πελάτη μάς ενημέρωσε
      ότι η πληρωμή θα γίνει από τον λογαριασμό {client_iban} μέσα στην εβδομάδα. Ο μέσος χρόνος
      είσπραξης τους τελευταίους δώδεκα μήνες είναι {days2} ημέρες.
    paraphrase: >-
      Όταν έκλεισε το τρίμηνο, ο πελάτης χρωστούσε {amount4}. Ληξιπρόθεσμο εδώ και {days} ημέρες
      είναι το τιμολόγιο του περασμένου μήνα· από το λογιστήριό του μας είπαν πως θα εξοφληθεί
      αυτή την εβδομάδα, με έμβασμα από τον λογαριασμό {client_iban}. Στο τελευταίο δωδεκάμηνο
      εισπράττουμε, κατά μέσο όρο, σε {days2} ημέρες.
  - id: kostos
    heading: Κόστος εξυπηρέτησης
    text: >-
      Το κόστος προσωπικού που επιβάρυνε τον λογαριασμό ήταν {amount5}. Καταγράφηκαν {days2}
      ημέρες εργασίας, από τις οποίες {days} εκτός ωραρίου λόγω δύο κρίσιμων περιστατικών. Οι
      υπερωρίες αυτές δεν τιμολογούνται, επειδή καλύπτονται από τη μηνιαία αμοιβή, και
      εξηγούν τη μείωση του περιθωρίου σε σχέση με το προηγούμενο τρίμηνο.
  - id: provlepsi
    heading: Πρόβλεψη επόμενου τριμήνου
    text: >-
      Για το επόμενο τρίμηνο αναμένονται έσοδα {amount2} από τη σύμβαση συντήρησης. Εκκρεμεί
      προσφορά ύψους {amount5} για αναβάθμιση του συστήματος, με πιθανότητα ανάθεσης περίπου
      {percent}%. Αν η αναβάθμιση προχωρήσει, θα χρειαστεί ένας επιπλέον μηχανικός για δύο
      μήνες, και το κόστος του έχει ήδη περιληφθεί στην προσφορά.
    translation: >-
      For the next quarter we expect revenue of {amount2} from the maintenance contract. An
      offer worth {amount5} for a system upgrade is pending, with roughly a {percent}% chance of
      being awarded. If the upgrade goes ahead, one more engineer will be needed for two months,
      and that cost is already included in the offer.
  - id: kindynoi
    heading: Κίνδυνοι
    text: >-
      Η σύμβαση λήγει στις {end_date} και ο πελάτης έχει ζητήσει μείωση της μηνιαίας αμοιβής
      κατά {percent}%. Παράλληλα εξετάζει προσφορά ανταγωνιστή. Η καθυστέρηση στις πληρωμές
      αυξήθηκε τα δύο τελευταία τρίμηνα, χωρίς ωστόσο να υπάρχει ένδειξη οικονομικής δυσκολίας.
      Δεν προτείνεται σχηματισμός πρόβλεψης επισφάλειας.
  - id: timologiaki
    heading: Τιμολογιακή πολιτική
    text: >-
      Η μηνιαία αμοιβή των {rate} δεν έχει αναπροσαρμοστεί από την υπογραφή της σύμβασης. Ο
      υπεύθυνος του λογαριασμού εισηγείται να διατηρηθεί η τιμή, να προσφερθεί έκπτωση μόνο σε
      περίπτωση τριετούς ανανέωσης και να τιμολογούνται χωριστά οι εργασίες εκτός ωραρίου που
      δεν αφορούν κρίσιμα περιστατικά.
  - id: energeies
    heading: Ενέργειες
    text: >-
      Να σταλεί υπενθύμιση για το ληξιπρόθεσμο τιμολόγιο και να επιβεβαιωθεί η είσπραξη, με
      ευθύνη του λογιστηρίου. Να παρουσιαστεί η πρόταση ανανέωσης στον πελάτη πριν από τις
      {end_date}· τη συνάντηση οργανώνει {lead:nom}. Να ετοιμαστεί σενάριο περιθωρίου για κάθε
      επίπεδο έκπτωσης πριν από την επόμενη ανασκόπηση.
  - id: scholia
    heading: Σχόλια για τη διοίκηση
    text: >-
      Η σχέση με τον πελάτη είναι καλή και η ικανοποίηση των χρηστών υψηλή. Η πίεση στις τιμές
      προέρχεται από το τμήμα προμηθειών. Η διοίκηση καλείται να αποφασίσει, πριν από τη
      συνάντηση ανανέωσης, ποιο είναι το κατώτατο αποδεκτό τίμημα, ώστε η διαπραγμάτευση να
      γίνει με σαφή εντολή.
  - id: vasi
    heading: Βάση σύνταξης
    text: >-
      Τα στοιχεία προέρχονται από το σύστημα τιμολόγησης και τα φύλλα χρόνου, όπως έκλεισαν στις
      {date}. Τα έσοδα της συντήρησης αναγνωρίζονται ισόποσα ανά μήνα και των πρόσθετων εργασιών
      με την ολοκλήρωσή τους. Τα μεγέθη δεν έχουν ελεγχθεί από ορκωτό ελεγκτή και αποτελούν
      εσωτερική πληροφόρηση, που δεν διανέμεται εκτός της Διεύθυνσης Οικονομικών.
footer: |-
  Διανομή: {lead}, {lead2}, Διεύθυνση Οικονομικών. Να μην προωθηθεί.
