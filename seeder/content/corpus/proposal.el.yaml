kind: proposal
category: CLIENT_CONFIDENTIAL
language: el
numbered: true
titles:
  - "Πρόταση συνεργασίας: αναδιοργάνωση εξυπηρέτησης πελατών {client:gen}"
  - "Δήλωση εργασιών: μετάπτωση συστήματος πελατολογίου {client:gen}"
  - "Τεχνική και οικονομική προσφορά προς {client:acc}"
header: |-
  Προς: {contact:acc}, {client:legal}
  Από: {lead:acc}, {org}
  Ημερομηνία: {date}
  Κωδικός: {reference} (έργο {project}, {project_code})

  Εμπιστευτικό έγγραφο. Απευθύνεται αποκλειστικά στον παραλήπτη του και δεν κοινοποιείται σε τρίτους χωρίς τη συναίνεση της {org}.
sections:
  - id: perilipsi
    heading: Σύνοψη
    text: >-
      Σας ευχαριστούμε για τη συνάντηση της προηγούμενης εβδομάδας. Όπως συζητήσαμε, προτείνουμε
      ένα έργο διάρκειας {weeks} εβδομάδων για τη μεταφορά του πελατολογίου σας σε νέο σύστημα
      και την αναδιοργάνωση της εξυπηρέτησης πελατών. Το συνολικό κόστος ανέρχεται σε {amount}
      πλέον ΦΠΑ και η ομάδα μας μπορεί να ξεκινήσει στις {start_date}.
    paraphrase: >-
      Μετά τη συνάντηση που είχαμε την περασμένη εβδομάδα, και με ευχαριστίες για τον χρόνο σας,
      καταθέτουμε την πρότασή μας: μεταφέρουμε το πελατολόγιο σε καινούργιο σύστημα και
      οργανώνουμε εκ νέου την εξυπηρέτηση πελατών, μέσα σε {weeks} εβδομάδες. Η δαπάνη φτάνει
      συνολικά τα {amount}, χωρίς τον ΦΠΑ, και η έναρξη μπορεί να γίνει στις {start_date}.
  - id: katastasi
    heading: Η σημερινή κατάσταση
    text: >-
      Σήμερα τα στοιχεία των πελατών σας βρίσκονται σε τρία διαφορετικά σημεία: στο λογιστικό
      πρόγραμμα, σε ένα παλιό σύστημα πελατολογίου και σε αρχεία που τηρούν οι πωλητές. Το ίδιο
      πρόσωπο εμφανίζεται συχνά με δύο ή τρεις εγγραφές. Τα αιτήματα των πελατών φτάνουν με
      τηλέφωνο και email, χωρίς να καταγράφονται, και ο μέσος χρόνος απάντησης ξεπερνά τις δύο
      ημέρες.
  - id: stochoi
    heading: Στόχοι του έργου
    text: >-
      Το έργο έχει τρεις στόχους. Πρώτον, μία και μοναδική εγγραφή για κάθε πελάτη, με πλήρη
      στοιχεία επικοινωνίας και ιστορικό. Δεύτερον, καταγραφή κάθε αιτήματος από τη στιγμή που
      φτάνει μέχρι να κλείσει. Τρίτον, μείωση του μέσου χρόνου απάντησης κάτω από τις οκτώ
      εργάσιμες ώρες μέσα στο πρώτο τρίμηνο λειτουργίας.
    translation: >-
      The project has three goals. First, one single record for each customer, with complete
      contact details and history. Second, a record of every request from the moment it arrives
      until it is closed. Third, an average response time below eight working hours within the
      first quarter of operation.
  - id: methodologia
    heading: Μεθοδολογία
    text: >-
      Ξεκινάμε με καθαρισμό των δεδομένων: εντοπίζουμε τις διπλές εγγραφές και σας τις
      παρουσιάζουμε για έγκριση πριν τις ενώσουμε. Ακολουθεί η παραμετροποίηση του νέου
      συστήματος και η δοκιμαστική μετάπτωση σε αντίγραφο των δεδομένων. Η οριστική μετάπτωση
      γίνεται Σαββατοκύριακο, ώστε τη Δευτέρα οι χρήστες να εργαστούν απευθείας στο νέο σύστημα.
  - id: paradotea
    heading: Παραδοτέα
    text: >-
      Θα παραλάβετε το νέο σύστημα πλήρως παραμετροποιημένο, αναφορά ποιότητας δεδομένων πριν και
      μετά τη μετάπτωση, εγχειρίδιο χρήσης στα ελληνικά, τέσσερις ώρες εκπαίδευσης για κάθε ομάδα
      χρηστών και υποστήριξη με φυσική παρουσία κατά την πρώτη εβδομάδα λειτουργίας. Όλα τα
      παραδοτέα εγκρίνονται εγγράφως από τον εκπρόσωπό σας.
    paraphrase: >-
      Στο τέλος του έργου έχετε στα χέρια σας: το καινούργιο σύστημα, ρυθμισμένο στις ανάγκες
      σας· μια αναφορά για την ποιότητα των δεδομένων, πριν και μετά τη μεταφορά τους· ελληνικό
      εγχειρίδιο για τους χρήστες· τετράωρη εκπαίδευση ανά ομάδα· και την ομάδα μας δίπλα σας, με
      φυσική παρουσία, όλη την πρώτη εβδομάδα. Ο εκπρόσωπός σας εγκρίνει γραπτά κάθε παραδοτέο.
  - id: omada
    heading: Ομάδα έργου
    text: >-
      Το έργο συντονίζει {lead:nom}, με εμπειρία σε αντίστοιχες μεταπτώσεις. Την τεχνική
      υλοποίηση αναλαμβάνει {lead2:nom}. Από τη δική σας πλευρά χρειαζόμαστε έναν υπεύθυνο έργου
      με δυνατότητα λήψης αποφάσεων και έναν χρήστη από κάθε τμήμα για τις δοκιμές αποδοχής,
      περίπου τρεις ώρες την εβδομάδα.
  - id: chronodiagramma
    heading: Χρονοδιάγραμμα
    text: >-
      Ο καθαρισμός των δεδομένων διαρκεί τις τρεις πρώτες εβδομάδες. Η παραμετροποίηση και η
      δοκιμαστική μετάπτωση ολοκληρώνονται έως το μέσο του έργου. Οι δοκιμές αποδοχής και η
      εκπαίδευση προηγούνται της οριστικής μετάπτωσης, που προγραμματίζεται λίγο πριν από τις
      {end_date}. Το χρονοδιάγραμμα προϋποθέτει ότι οι εγκρίσεις σας δίνονται εντός τριών
      εργάσιμων ημερών.
  - id: oikonomika
    heading: Οικονομική προσφορά
    text: >-
      Το τίμημα για το σύνολο των εργασιών είναι {amount} πλέον ΦΠΑ. Καταβάλλεται {percent}% με
      την υπογραφή, και το υπόλοιπο σε δύο ίσες δόσεις, με την ολοκλήρωση της δοκιμαστικής και
      της οριστικής μετάπτωσης αντίστοιχα. Οι άδειες χρήσης του λογισμικού δεν περιλαμβάνονται
      και τιμολογούνται απευθείας από τον κατασκευαστή. Πρόσθετες εργασίες χρεώνονται {rate} ανά
      ημέρα.
    paraphrase: >-
      Για όλες τις εργασίες ζητάμε {amount}, ποσό στο οποίο προστίθεται ο ΦΠΑ. Το {percent}%
      πληρώνεται μόλις υπογραφεί η συμφωνία· τα υπόλοιπα χρήματα μοιράζονται σε δύο ίσα μέρη,
      ένα όταν τελειώσει η δοκιμαστική μετάπτωση και ένα όταν τελειώσει η οριστική. Τις άδειες
      του λογισμικού τις τιμολογεί ο ίδιος ο κατασκευαστής και δεν περιέχονται στο ποσό. Κάθε
      επιπλέον ημέρα εργασίας κοστίζει {rate}.
  - id: paradoches
    heading: Παραδοχές
    text: >-
      Η προσφορά βασίζεται στην παραδοχή ότι οι ενεργοί πελάτες δεν ξεπερνούν τις είκοσι
      χιλιάδες και ότι το ιστορικό που θα μεταφερθεί καλύπτει τα τελευταία πέντε έτη. Η
      διασύνδεση με το λογιστικό πρόγραμμα γίνεται μέσω των έτοιμων διεπαφών του. Αν χρειαστεί
      ανάπτυξη ειδικής διεπαφής, θα σας υποβάλουμε χωριστή εκτίμηση πριν ξεκινήσει.
  - id: kindynoi
    heading: Κίνδυνοι
    text: >-
      Ο σημαντικότερος κίνδυνος είναι η χαμηλή ποιότητα των δεδομένων, που μπορεί να αυξήσει τον
      χρόνο καθαρισμού. Τον αντιμετωπίζουμε με δειγματοληπτικό έλεγχο την πρώτη εβδομάδα και
      άμεση ενημέρωσή σας. Ο δεύτερος είναι η αντίσταση των χρηστών στην αλλαγή· γι' αυτό
      εμπλέκουμε έναν χρήστη από κάθε τμήμα από την αρχή και όχι μόνο στην εκπαίδευση.
    translation: >-
      The most important risk is poor data quality, which can lengthen the clean-up. We deal
      with it through a sample check in the first week and by telling you at once. The second
      is users resisting the change; this is why we involve one user from each department from
      the start, and not only in training.
  - id: aporrito
    heading: Απόρρητο και προσωπικά δεδομένα
    text: >-
      Το πελατολόγιό σας περιέχει ονόματα, τηλέφωνα, διευθύνσεις και ΑΦΜ φυσικών προσώπων. Η
      ομάδα μας εργάζεται μόνο μέσα στα δικά σας συστήματα και δεν εξάγει δεδομένα σε δικούς της
      υπολογιστές. Για τις δοκιμές χρησιμοποιούμε αντίγραφο στο οποίο τα προσωπικά στοιχεία
      έχουν αντικατασταθεί. Η πρόσβασή μας καταργείται την ημέρα παράδοσης του έργου.
  - id: epomena
    heading: Επόμενα βήματα
    text: >-
      Η προσφορά ισχύει για {days} ημέρες. Εφόσον συμφωνείτε, παρακαλούμε να μας το επιβεβαιώσετε
      στη διεύθυνση {lead_email}, ώστε να σας αποστείλουμε τη σύμβαση προς υπογραφή και να
      κλείσουμε την εναρκτήρια συνάντηση. Είμαστε στη διάθεσή σας για κάθε διευκρίνιση, και
      ευχαρίστως παρουσιάζουμε την πρόταση στη διοίκησή σας.
footer: |-
  Με εκτίμηση,
  {lead}
  {org}
